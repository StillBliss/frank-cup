<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Frank Cup</title>
<style>
:root{
  --field:#0B1610; --housing:#111E16;
  --panel:rgba(255,255,255,.05); --rule:rgba(255,255,255,.15);
  --bone:#EDEAE0; --bone-dim:#B2BAB1; --bone-faint:#828C84;
  --bulb:#E8A62E;
  --hot:#D22D49; --cold:#3661AD;
  --win:#C42F45; --loss:#31599E;
  --cond:"Haettenschweiler","Arial Narrow Bold","Arial Narrow",Impact,system-ui,sans-serif;
  /* numerals: a plain sans with tabular figures. The condensed face above is a
     display font and turns numbers heavy and hard to read at small sizes. */
  --num:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* every figure on the page lines up and stays legible */
td,th,.num,.tally,.grade,.apw,.ts b,.pl b,.tr-sc,.tr-wk,.tr-res,.kpi .v,.rk,
.tie .row .sc,.tie .row .sd,.form span,.wk-pick button{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
*{box-sizing:border-box}
/* the page scrollbar is always allowed for, so switching to a season with more
   or less content cannot slide the whole layout sideways */
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--field);color:var(--bone);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;position:relative;min-height:100vh}
body>*{position:relative;z-index:1}
h1,h2,h3{font-family:var(--cond);font-weight:500;letter-spacing:.02em;margin:0}
button{font-family:inherit}

.board{background:var(--housing);border-bottom:3px solid var(--rule);padding:16px 20px 0;position:sticky;top:0;z-index:30}
.board-top{max-width:1200px;margin:0 auto;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mark{font-family:var(--cond);font-size:30px;line-height:1;letter-spacing:.07em}
.mark span{color:var(--bulb)}
.parkname{font-size:12px;color:var(--bone-faint);letter-spacing:.04em}
.season-pick{display:flex;margin-left:auto;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.season-pick button{font-family:var(--cond);font-size:16px;letter-spacing:.05em;background:transparent;
  color:var(--bone-dim);border:0;padding:7px 15px;cursor:pointer;border-right:1px solid var(--rule)}
.season-pick button:last-child{border-right:0}
.season-pick button[aria-pressed="true"]{background:var(--bulb);color:#241A05}
.season-pick button:focus-visible{outline:2px solid var(--bone);outline-offset:-2px}
nav{max-width:1200px;margin:12px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font-family:var(--cond);font-size:15px;letter-spacing:.06em;white-space:nowrap;background:transparent;
  border:0;border-bottom:3px solid transparent;color:var(--bone-faint);padding:9px 15px;cursor:pointer}
nav button[aria-current="page"]{color:var(--bone);border-bottom-color:var(--bulb)}
nav button:focus-visible{outline:2px solid var(--bulb);outline-offset:-3px}

main{max-width:1200px;margin:0 auto;padding:26px 20px 90px}
.view{display:none}.view.on{display:block}
.lede{color:var(--bone-dim);max-width:66ch;margin:0 0 20px;font-size:14px}
.lede.tight{margin-bottom:10px}
h2.sec{font-size:20px;letter-spacing:.05em;margin:34px 0 12px}
h2.sec:first-child{margin-top:0}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:rgba(10,16,12,.72);border:1px solid var(--rule);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:15px;font-family:var(--num)}
td{font-weight:450}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-family:var(--cond);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--bone-faint);
  position:sticky;top:0;background:var(--housing);z-index:2}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
tbody tr:hover{background:rgba(255,255,255,.05)}
.rk{color:var(--bone-faint);font-family:var(--num);font-size:14px;width:1%}
.dot{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:8px;flex:none}
.sub{color:var(--bone-faint);font-size:12px}
.who{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;cursor:pointer;
  border-bottom:1px dotted transparent;display:inline-flex;align-items:center;gap:0}
.who:hover{border-bottom-color:currentColor}
.who:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.crown{margin-left:4px;font-size:13px;line-height:1;flex:none;
  display:inline-block;width:15px;text-align:center}
.crown.reg{filter:saturate(.2) brightness(1.4)}
.crown.ph{visibility:hidden}

th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--bone)}
th.sortable[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
th.sortable[aria-sort="descending"]::after{content:" ▼";font-size:9px}
th.eq,td.eq{width:60px;min-width:60px;max-width:60px;overflow:hidden;text-overflow:ellipsis}
table.catline th,table.catline td{font-size:15px;padding:7px 6px;font-weight:450}
table.catline td.catw{font-weight:650}
table.catline th.eq,table.catline td.eq{width:64px;min-width:64px;max-width:64px}

.form span{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;
  font-family:var(--num);font-size:11px;font-weight:700;border-radius:3px;color:#0B0F0C}
.form .w{background:var(--win);color:#fff}
.form .l{background:var(--loss);color:#fff}
.form .t{background:rgba(255,255,255,.30);color:var(--bone)}

.toggle{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin-bottom:8px}
.toggle button{font-family:var(--cond);font-size:14px;letter-spacing:.05em;background:transparent;
  color:var(--bone-dim);border:0;padding:6px 14px;cursor:pointer;border-right:1px solid var(--rule)}
.toggle button:last-child{border-right:0}
.toggle button[aria-pressed="true"]{background:var(--bulb);color:#241A05}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bone-faint);margin:0 0 14px;flex-wrap:wrap}
.ramp .strip{height:10px;width:150px;border-radius:1px;
  background:linear-gradient(90deg,var(--cold),rgba(255,255,255,.12),var(--hot))}
.key{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
.key i{width:11px;height:11px;border-radius:2px;display:inline-block;font-style:normal}

.wk-pick{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;align-items:center}
.wk-pick button{font-family:var(--num);font-size:13.5px;font-weight:500;min-width:38px;background:var(--panel);
  border:1px solid var(--rule);color:var(--bone-dim);padding:6px 9px;cursor:pointer;border-radius:2px}
.wk-pick button[aria-pressed="true"]{background:var(--bulb);color:#241A05;border-color:var(--bulb)}
.wk-pick button.po{border-color:var(--bulb);color:var(--bulb)}
.wk-pick button.po[aria-pressed="true"]{background:var(--bulb);color:#241A05}
.wk-div{width:1px;height:22px;background:var(--rule);margin:0 6px}
.wk-lbl{font-family:var(--cond);font-size:12px;letter-spacing:.09em;color:var(--bulb)}
.games{display:grid;gap:10px;max-width:940px;margin:0 auto}
.game{background:rgba(10,16,12,.74);border:1px solid var(--rule);border-radius:3px;
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;
  gap:10px;padding:14px 18px}
.side{min-width:0}.side.b{text-align:right}
.side .nm{font-weight:600;font-size:17px;display:flex;align-items:center;gap:2px}
.side.b .nm{justify-content:flex-end}
.side .tm{color:var(--bone-faint);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally{font-family:var(--num);font-size:27px;font-weight:600;line-height:1;white-space:nowrap;padding:0 12px;letter-spacing:-.01em}
.tally .v{color:var(--bone-faint)}.tally .v.win{color:var(--bone)}
.tally i{color:var(--bone-faint);font-size:15px;font-style:normal;padding:0 5px}
.stagetag{font-family:var(--cond);font-size:12px;letter-spacing:.08em;color:var(--bulb);
  border:1px solid var(--bulb);border-radius:2px;padding:0 6px;margin-left:8px}
.detail{margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
.detail summary{cursor:pointer;font-family:var(--cond);font-size:13px;letter-spacing:.07em;color:var(--bulb)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:1px;margin-top:12px;background:var(--rule)}
.cat{background:var(--housing);padding:7px 9px}
.cat .k{font-family:var(--cond);font-size:12px;letter-spacing:.08em;color:var(--bone-faint)}
.cat .val{font-size:15px;font-weight:600}

.chartbox{background:rgba(10,16,12,.74);border:1px solid var(--rule);border-radius:3px;padding:14px;margin-bottom:16px}
.chartbox h3{font-size:16px;letter-spacing:.04em}
.chartbox p{margin:0 0 12px;color:var(--bone-faint);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:14px}
.legend button{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--bone-dim);
  font-size:13px;cursor:pointer;padding:2px 0}
.legend button[aria-pressed="false"]{opacity:.30}
.hm td.c{padding:5px 0;text-align:center;font-size:12px;min-width:26px}

/* head to head */
.h2h td.cell{cursor:pointer;font-weight:600}
.h2h td.cell.w{background:rgba(196,47,69,.42)}
.h2h td.cell.l{background:rgba(49,89,158,.42)}
.h2h td.cell.e{background:rgba(255,255,255,.10)}
.h2h td.cell:hover{outline:2px solid var(--bulb);outline-offset:-2px}
.pop{position:fixed;z-index:60;background:var(--housing);border:1px solid var(--bulb);border-radius:4px;
  box-shadow:0 10px 34px rgba(0,0,0,.6);padding:12px 14px;min-width:236px;font-size:13px}
.pop h4{font-family:var(--cond);font-size:15px;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pop table{width:100%;font-size:13px}
.pop th,.pop td{padding:4px 6px;border-bottom:1px solid var(--rule);position:static;background:none}
.pop .cls{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--bone-faint);cursor:pointer;font-size:15px}

/* bracket */
.bracket{display:grid;gap:14px;align-items:center;overflow-x:auto;padding:4px 0 8px}
.bracket5{grid-template-columns:1.05fr 1fr 1.15fr 1fr 1.05fr}
.brcol{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-height:330px}
.rndlbl{font-family:var(--cond);font-size:12px;letter-spacing:.11em;color:var(--bone-faint);text-align:center;margin-bottom:4px}
.tie{border:1px solid var(--rule);border-radius:3px;background:rgba(10,16,12,.8);overflow:hidden}
.tie .row{display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:13px}
.tie .row+.row{border-top:1px solid var(--rule)}
.tie .row.w{background:rgba(196,47,69,.26)}
.tie .row .sd{font-family:var(--cond);font-size:12px;color:var(--bone-faint);width:14px;flex:none}
.tie .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tie .row .sc{font-family:var(--num);font-size:16px;font-weight:600;flex:none}
.tie .row.lo{color:var(--bone-faint)}
.tie .tiebreak{font-size:11px;color:var(--bulb);padding:5px 9px;border-top:1px solid var(--rule)}
.byebox{border:1px dashed var(--rule);border-radius:3px;padding:7px 9px;font-size:13px;color:var(--bone-faint);
  display:flex;align-items:center;gap:7px}
.champbox{border:1px solid var(--bulb);border-radius:3px;padding:14px 10px;text-align:center;background:rgba(232,166,46,.12)}
.champbox .lb{font-family:var(--cond);font-size:12px;letter-spacing:.13em;color:var(--bulb)}
.champbox .nm{font-family:var(--cond);font-size:26px;margin-top:3px;display:flex;justify-content:center;align-items:center;gap:6px}

/* manager */
.mghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mgname{font-family:var(--cond);font-size:38px;line-height:1;letter-spacing:.03em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;margin:18px 0 8px;overflow:hidden}
.kpi{background:rgba(10,16,12,.85);padding:12px 13px}
.kpi .k{font-family:var(--cond);font-size:12px;letter-spacing:.08em;color:var(--bone-faint)}
.kpi .v{font-family:var(--num);font-size:21px;font-weight:600;line-height:1.2;margin-top:3px;letter-spacing:-.01em}
.namerow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.namerow .yr{font-family:var(--cond);color:var(--bone-faint);width:70px;flex:none}
.back{background:transparent;border:1px solid var(--rule);color:var(--bone-dim);border-radius:2px;
  padding:5px 11px;font-size:13px;cursor:pointer;margin-bottom:16px}

.note{background:rgba(10,16,12,.74);border-left:3px solid var(--bulb);padding:11px 14px;font-size:13px;
  color:var(--bone-dim);margin:18px 0;border-radius:0 2px 2px 0}
.empty{color:var(--bone-faint);padding:26px 0;font-size:14px}
footer{border-top:1px solid var(--rule);color:var(--bone-faint);font-size:12px;padding:18px 20px 40px;max-width:1200px;margin:0 auto}

@media (max-width:760px){
  .mark{font-size:23px}main{padding:20px 14px 70px}.board{padding:14px 14px 0}
  .season-pick{margin-left:0;width:100%}.season-pick button{flex:1}
  th,td{padding:7px 6px;font-size:13px}
  .game{padding:12px;gap:4px}.tally{font-size:22px}.side .nm{font-size:13px}
  .bracket{grid-template-columns:repeat(5,minmax(148px,1fr));gap:10px}
  .mgname{font-size:29px}
  th.eq,td.eq{width:54px;min-width:54px;max-width:54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body[data-season="2023"]{--field:#0C1712;--housing:#10201A}
body[data-season="2024"]{--field:#0B1420;--housing:#101D2B}
body[data-season="2025"]{--field:#17100E;--housing:#211714}
body[data-season="2026"]{--field:#0E1020;--housing:#15182C}
body[data-season="ALL"]{--field:#0F0F11;--housing:#191A1D}
body{background:var(--field)}

table.catline td.catw{background:rgba(62,140,84,.30);font-weight:600}
table.catline td.catl{color:var(--bone-faint)}
table.catline th.ns,table.catline td.ns{color:var(--bone-faint)}
.catbox{margin-top:10px}
.catbox .note{margin:6px 0 0;font-size:11.5px;color:var(--bone-faint)}
#seasonPick button[disabled]{opacity:.35;cursor:not-allowed}

.game.clickable{cursor:pointer}
.game.clickable:hover{background:rgba(255,255,255,.04)}
.game.clickable:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

table th,table td{text-align:center !important;vertical-align:middle}
table th.l,table td.l{text-align:center !important;white-space:normal}
table td.l .who,table td.l button{display:inline-block;white-space:nowrap}
table.h2h th,table.h2h td{min-width:62px}
table.h2h td.l,table td.l{min-width:104px}
.form{justify-content:center;display:flex;gap:4px}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:rgba(255,255,255,.05);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;text-align:left}
.pcard h3{margin:0 0 8px;font-size:15px;letter-spacing:.05em;color:var(--bulb)}
.pcard ol{margin:0;padding-left:20px}
.pcard li{font-size:13.5px;margin:3px 0}
.pcard .sub{display:block;margin-top:8px;font-size:11.5px;color:var(--bone-faint)}
.pcard li .sub{display:inline;margin:0}

.chartwrap{position:relative}
.chartwrap .tip{position:absolute;top:8px;background:var(--housing);border:1px solid var(--rule);
  border-radius:3px;padding:7px 9px;font-size:12px;pointer-events:none;min-width:150px;z-index:5;text-align:left}
.chartwrap .tiphd{font-family:var(--cond);letter-spacing:.05em;color:var(--bone-faint);margin-bottom:4px}
.chartwrap .tiprow{display:flex;align-items:center;gap:6px;line-height:1.5}
.chartwrap .tiprow .dot{width:8px;height:8px;border-radius:2px;flex:none}
.chartwrap .tiprow .tn{flex:1}
.chartwrap .tiprow .tv{font-variant-numeric:tabular-nums;color:var(--bone)}
th.exp,td.exp{color:var(--bone-dim);background:rgba(255,255,255,.035)}
.yrhead{font-family:var(--cond);font-size:17px;letter-spacing:.05em;margin:18px 0 6px;
  display:flex;gap:10px;align-items:baseline;justify-content:center}
.yrhead .sub{font-size:11.5px;color:var(--bone-faint)}

table.stand th.sortable{cursor:pointer;user-select:none}
table.stand th.sortable:hover{color:var(--bone)}
table.stand th[aria-sort]{color:var(--bulb)}

.apw{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.02em;color:var(--bone-faint);
  background:transparent;border:1px solid var(--rule);border-radius:9px;padding:2px 7px;margin:0 4px;
  white-space:nowrap;vertical-align:middle;cursor:pointer}
.apw:hover{color:var(--bone);border-color:var(--bone-faint)}
.grade{font-family:var(--num);font-size:13px;letter-spacing:0;font-weight:600;
  color:var(--bone);background:rgba(255,255,255,.06);border:1px solid var(--rule);
  border-radius:9px;padding:1px 7px;margin:0 4px;white-space:nowrap;vertical-align:middle}
.grade.hot{color:#E8B04B;border-color:rgba(232,176,75,.45);background:rgba(232,176,75,.10)}
.grade.cold{color:#7FA8D6;border-color:rgba(127,168,214,.40);background:rgba(127,168,214,.09)}

.plusrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 12px}
.plusrow .note{grid-column:1/-1;margin:2px 0 0;font-size:11.5px;color:var(--bone-faint);line-height:1.45}
.plusteam{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:rgba(255,255,255,.02)}
.pl-nm{font-family:var(--cond);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--bone-faint);margin-bottom:6px}
.pl-pair{display:flex;gap:14px;flex-wrap:wrap}
.pl{display:flex;flex-direction:column;line-height:1.2}
.pl i{font-style:normal;font-family:var(--cond);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--bone-faint)}
.pl b{font-family:var(--num);font-size:20px;font-weight:600;color:var(--bone);letter-spacing:-.01em}
.pl.hot b{color:#E8B04B}
.pl.cold b{color:#7FA8D6}
.pl.g b{color:var(--bulb)}
@media(max-width:720px){.plusrow{grid-template-columns:1fr}}
/* by-team matchup list */
.team-pick button{display:inline-flex;align-items:center;gap:5px;min-width:0;padding:3px 10px}
.teamhead{max-width:720px;margin:0 auto 6px;display:flex;align-items:baseline;gap:8px;font-size:18px}
.teamhead b{font-weight:600}
.teamhead .tm{color:var(--bone-faint);font-size:13px}
.tsum{max-width:720px;margin:0 auto 8px;display:grid;gap:5px;
  grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.ts{border:1px solid var(--rule);border-radius:3px;padding:4px 7px;
  background:rgba(10,16,12,.74);min-width:0}
.ts i{display:block;font-style:normal;font-family:var(--cond);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--bone-faint)}
.ts b{font-family:var(--num);font-size:15px;font-weight:600;color:var(--bone);letter-spacing:-.01em;
  white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.ts.g b{color:var(--bulb)}
.trows{display:grid;gap:2px;max-width:720px;margin:0 auto}
.trow{background:rgba(10,16,12,.74);border:1px solid var(--rule);border-radius:3px;padding:3px 10px}
.trow.clickable{cursor:pointer}
.trow.clickable:hover{border-color:var(--bone-faint)}
.tr-main{display:grid;grid-template-columns:26px 22px 62px minmax(0,1fr) 46px 46px 40px 70px;
  align-items:center;gap:6px;line-height:1.1}
.tr-gr,.tr-ap,.tr-hp{display:flex;align-items:center;justify-content:flex-end;white-space:nowrap}
.tr-gr .grade,.tr-ap .apw,.tr-hp .grade{margin:0}
.grade.mini{font-size:12px;padding:1px 5px;font-weight:500}
.grade.mini i{font-style:normal;font-family:var(--cond);font-size:10px;letter-spacing:.06em;
  color:var(--bone-faint);margin-right:3px}
.tr-wk{font-family:var(--num);font-size:14px;font-weight:500;color:var(--bone-faint);text-align:right}

/* wider cells for the long numbers (innings) */

/* all-time record for the category, across every season */

<body data-season="2026">
<header class="board">
  <div class="board-top">
    <div class="mark">THE FRANK <span>CUP</span></div>
    <div class="parkname" id="parkName"></div>
    <div class="season-pick" id="seasonPick" role="group" aria-label="Choose season"></div>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
</header>
<main>
  <section class="view on" id="v-standings"></section>
  <section class="view" id="v-matchups"></section>
  <section class="view" id="v-trends"></section>
  <section class="view" id="v-stats"></section>
    <section class="view" id="v-bracket"></section>
  <section class="view" id="v-history"></section>
  <section class="view" id="v-manager"></section>
</main>
<footer id="foot"></footer>
<script src="data.js"></script>
<script>
const PARK_NAMES = {};
(function(){
const D=LEAGUE_DATA, ALLK=D.allTimeKey||"ALL", SEASONS=Object.keys(D.seasons).sort(),
  YEARS=Object.keys(D.seasons).filter(s=>s!==(D.allTimeKey||"ALL")).sort();
let season=String(D.meta.currentSeason), view="standings";
let week=null, statMode="raw", who=null, backTo="standings";
let sortCol=null, sortDir=-1;
let mMode="week", mTeam=null;
const hidden=new Set(), lower=new Set(D.lowerBetter);

const col=m=>"#"+D.colors[m];
const rec=(w,l,t)=>w+"-"+l+"-"+t;
const pct3=p=>p.toFixed(3).replace(/^0/,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=id=>document.getElementById(id);
const VIEWS=[["standings","Standings"],["matchups","Matchups"],["trends","Trends"],
 ["stats","Team stats"],["bracket","Bracket"],["history","History"]];

/* innings: decimal thirds -> baseball notation */
function ipFmt(v){
  const whole=Math.floor(v+1e-9);
  const outs=Math.round((v-whole)*3);
  return outs>=3 ? (whole+1)+".0" : whole+"."+outs;
}
function fmtStat(c,v){
  if(v==null) return "—";
  if(c==="AVG"||c==="OPS") return Number(v).toFixed(3).replace(/^0/,"");
  if(c==="ERA"||c==="WHIP"||c==="K/BB") return Number(v).toFixed(2);
  if(c==="IP") return ipFmt(Number(v));
  return v;
}
/* ---- Hitting+ / Pitching+ ------------------------------------------------
   For each scoring category in a week, a team is scored against the other nine:
   a win is 1, a tie is .5, out of 9. The 11 hitting categories average into
   Hitting+, the 11 pitching categories into Pitching+, scaled so that the
   league average is exactly 100 in every week regardless of how many games
   that week held. Grade is the mean of the two.                             */
/* Playoff weeks are scored against every team that played that week, consolation
   included. Those teams are out of the bracket, but their lines were produced
   under the same conditions that week, which is what makes them a fair yardstick;
   a four-team field would swing the scale wildly, and season averages would mix
   in weeks of a different length. Consolation games stay out of the bracket and
   the matchup list, which is where being knocked out actually matters. */
const PLUS_CACHE={};
function plusWeek(sea,wk){
  const key=sea+"|"+wk;
  if(PLUS_CACHE[key]!==undefined) return PLUS_CACHE[key];
  const det=(D.weeklyDetail||{})[sea]||{};
  const skip=new Set(D.nonScoring||["H/AB"]);
  const HIT=[],PIT=[];
  D.cats.forEach((c,i)=>{ if(skip.has(c))return; (i<D.hitN?HIT:PIT).push(i); });
  /* Infinity is a real value here (K/BB with no walks allowed), not missing data. */
  const num=v=>(typeof v==="number"&&!isNaN(v))?v:null;
  const live={};
  D.managers.forEach(m=>{ const e=det[m]&&det[m][wk]; if(e&&e.you) live[m]=e.you; });
  const who=Object.keys(live);
  if(who.length<4){ return PLUS_CACHE[key]=null; }
  const acc={}; who.forEach(m=>acc[m]={H:[],P:[]});
  HIT.concat(PIT).forEach(i=>{
    const bucket=HIT.indexOf(i)>-1?"H":"P", lb=lower.has(D.cats[i]);
    who.forEach(m=>{
      const a=num(live[m][i]); if(a===null) return;
      let pts=0,n=0;
      who.forEach(o=>{
        if(o===m) return;
        const c=num(live[o][i]); if(c===null) return;
        n++; if(a===c) pts+=.5; else if(lb?a<c:a>c) pts+=1;
      });
      if(n) acc[m][bucket].push(pts/n);
    });
  });
  const out={};
  who.forEach(m=>{
    const avg=a=>a.length?200*a.reduce((s,v)=>s+v,0)/a.length:null;
    const H=avg(acc[m].H), P=avg(acc[m].P);
    out[m]={H,P,G:(H===null?P:P===null?H:(H+P)/2)};
  });
  return PLUS_CACHE[key]=out;
}
/* Weekly all-play, computed from the same raw lines. The stored version this
   replaced was generated from an earlier hand-entered dataset and disagreed
   with the API data in 86% of cases; deriving it here keeps it honest as new
   weeks land.                                                               */
const AP_CACHE={};
function allPlayWeek(sea,wk){
  const key=sea+"|"+wk;
  if(AP_CACHE[key]!==undefined) return AP_CACHE[key];
  const det=(D.weeklyDetail||{})[sea]||{};
  const skip=new Set(D.nonScoring||["H/AB"]);
  const IDX=D.cats.map((c,i)=>skip.has(c)?-1:i).filter(i=>i>=0);
  const num=v=>(typeof v==="number"&&!isNaN(v))?v:null;
  const live={};
  D.managers.forEach(m=>{ const e=det[m]&&det[m][wk]; if(e&&e.you) live[m]=e.you; });
  const who=Object.keys(live);
  if(who.length<4) return AP_CACHE[key]=null;
  const out={};
  who.forEach(me=>{
    let W=0,L=0,T=0; const vs=[];
    who.forEach(o=>{
      if(o===me) return;
      let w=0,l=0,t=0;
      IDX.forEach(i=>{
        const a=num(live[me][i]), c=num(live[o][i]);
        if(a===null||c===null) return;
        const lb=lower.has(D.cats[i]);
        if(a===c) t++; else if(lb?a<c:a>c) w++; else l++;
      });
      const res=w>l?"W":l>w?"L":"T";
      if(res==="W") W++; else if(res==="L") L++; else T++;
      vs.push({opp:o,w,l,t,res});
    });
    vs.sort((x,y)=>(y.w-y.l)-(x.w-x.l)||x.opp.localeCompare(y.opp));
    out[me]={w:W,l:L,t:T,vs};
  });
  return AP_CACHE[key]=out;
}

const plusFmt=v=>v===null||v===undefined?"—":Math.round(v);
function plusTone(v){ return v===null||v===undefined?"":v>=115?" hot":v<=85?" cold":""; }

/* One ramp for the whole page: hot at 0, neutral at .5, cold at 1.
   Distance from the middle is eased so a value only a little above average
   already reads as coloured, and the two ends land at full strength instead
   of the washed-out 62% they used to stop at. */
function heat(t){
  t=Math.max(0,Math.min(1,t));
  const hotC=[210,45,73], coldC=[54,97,173], w=[255,255,255];
  const e=Math.pow(Math.abs(t-0.5)*2,0.6);
  const end=t<0.5?hotC:coldC;
  const c=w.map((v,i)=>v+(end[i]-v)*e);
  return `rgba(${c.map(Math.round).join(",")},${(0.14+0.80*e).toFixed(2)})`;
}
/* grade / plus values sit on the same ramp: 100 is average, 60-140 the useful spread */
const plusBg=v=>v==null?"transparent":heat(1-Math.max(0,Math.min(1,(v-60)/80)));

/* crowns for the selected season */
/* Both crown slots are always emitted, empty ones as a blank of the same width.
   Otherwise a name is wider in the seasons where that manager won something, the
   table resizes its name column, and the whole layout slides when you change
   season. */
function crowns(m){
  const regChamp = D.seasons[season].standings[0].manager===m;
  const poChamp = (D.finalPlace[season]||[])[0]===m;
  return (regChamp
      ? `<span class="crown reg" title="Regular season champion, ${season}" aria-label="Regular season champion">🏵</span>`
      : `<span class="crown ph" aria-hidden="true"></span>`)
    + (poChamp
      ? `<span class="crown" title="Playoff champion, ${season}" aria-label="Playoff champion">👑</span>`
      : `<span class="crown ph" aria-hidden="true"></span>`);
}
const nameBtn=m=>`<button type="button" class="who" data-mgr="${esc(m)}">
  <span class="dot" style="background:${col(m)}"></span>${esc(m)}${crowns(m)}</button>`;
const nameBare=m=>`<button type="button" class="who" data-mgr="${esc(m)}">${esc(m)}${crowns(m)}</button>`;

function buildChrome(){
  el("seasonPick").innerHTML=SEASONS.map(s=>`<button type="button" data-s="${s}" aria-pressed="${s===season}">${s}</button>`).join("");
  el("seasonPick").onclick=e=>{const b=e.target.closest("button");if(!b)return;season=b.dataset.s;week=null;sortCol=null;render();};
  el("nav").innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}" aria-current="${k===view?"page":"false"}">${l}</button>`).join("");
  el("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;sortCol=null;render();};
  el("foot").innerHTML=esc(D.meta.note)+" 🏵 regular-season champion · 👑 playoff champion.";
  document.addEventListener("click",e=>{
    const b=e.target.closest(".who");
    if(b){who=b.dataset.mgr;backTo=view==="manager"?backTo:view;view="manager";render();return;}
    if(!e.target.closest(".pop")&&!e.target.closest(".cell")) closePop();
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop();});
}

/* ---------- standings ---------- */
function seasonForm(m){
  const S=D.seasons[season];
  const g=S.matchups.filter(x=>x.stage==="Regular"&&(x.a===m||x.b===m))
    .map(x=>x.a===m?{w:x.aw,l:x.al}:{w:x.al,l:x.aw})
    .slice(-5);
  return g.map(x=>x.w>x.l?'<span class="w">W</span>':x.w<x.l?'<span class="l">L</span>':'<span class="t">T</span>').join("");
}
function longestSkid(m){
  const S=D.seasons[season];
  const g=S.matchups.filter(x=>x.stage==="Regular"&&(x.a===m||x.b===m))
    .sort((p,q)=>(p.season||0)-(q.season||0)||p.week-q.week)
    .map(x=>x.a===m?{w:x.aw,l:x.al}:{w:x.al,l:x.aw});
  let cur=0,best=0;
  g.forEach(x=>{if(x.l>x.w){cur++;best=Math.max(best,cur);}else cur=0;});
  return best;
}
function longestStreak(m){
  const S=D.seasons[season];
  const g=S.matchups.filter(x=>x.stage==="Regular"&&(x.a===m||x.b===m))
    .sort((p,q)=>(p.season||0)-(q.season||0)||p.week-q.week).map(x=>x.a===m?{w:x.aw,l:x.al}:{w:x.al,l:x.aw});
  let cur=0,best=0;
  g.forEach(x=>{if(x.w>x.l){cur++;best=Math.max(best,cur);}else cur=0;});
  return best;
}
function weeksInFirst(m){
  return D.seasons[season].progression.filter(p=>p.rank[m]===1).length;
}
function vStandings(){
  const S=D.seasons[season];
  const dc=(D.drawCats&&D.drawCats[season])||{};
  const dw=(D.drawWeeks&&D.drawWeeks[season])||{};
  const R=x=>x?`${x[0]}-${x[1]}-${x[2]}`:"\u2014";
  const half=x=>x?x[0]+x[2]/2:null;
  const data=S.standings.map((r,i)=>{
    const c=dc[r.manager]||null, w=dw[r.manager]||null;
    return {seed:i+1, m:r.manager,
      cat:[r.w,r.l,r.t], ecat:c&&c.exp, cdraw:c?c.draw:null,
      wk:[r.mw,r.ml,r.mt], ewk:w&&w.exp, wdraw:w?w.draw:null,
      gb:r.gb, run:longestStreak(r.manager), skid:longestSkid(r.manager),
      first:weeksInFirst(r.manager)};
  });
  /* expected rank: order the expected category records exactly the way the real
     standings order the actual ones */
  const erank={};
  [...data].filter(d=>d.ecat).sort((x,y)=>half(y.ecat)-half(x.ecat))
    .forEach((d,i)=>erank[d.m]=i+1);
  data.forEach(d=>d.erank=erank[d.m]??null);
  /* expected games behind, by the same arithmetic the real GB column uses:
     half the sum of the win gap and the loss gap against the best expected record */
  const lead=[...data].filter(d=>d.ecat).sort((x,y)=>half(y.ecat)-half(x.ecat))[0];
  data.forEach(d=>d.egb=(d.ecat&&lead)?((lead.ecat[0]-d.ecat[0])+(d.ecat[1]-lead.ecat[1]))/2:null);
  /* scale each Draw column to its own observed spread so the ramp is actually used */
  const spread=k=>Math.max(1,...data.map(d=>Math.abs(d[k]??0)));
  const cSp=spread("cdraw"), wSp=spread("wdraw");
  const sign=(v,sp)=>v==null?"\u2014":`<span style="background:${heat(1-(0.5+v/(2*sp)))};padding:1px 6px;border-radius:2px">${v>0?"+":""}${v}</span>`;
  const COLS=[
    {k:"seed", h:"#", get:d=>d.seed, cls:"l", fmt:d=>d.seed},
    {k:"erank", h:"Exp #", exp:true, get:d=>d.erank==null?null:-d.erank,
     fmt:d=>d.erank??"\u2014",
     title:"Where the expected category record would place you"},
    {k:"m", h:"Manager", get:d=>d.m, cls:"l", text:true},
    {k:"cat", h:"Categories", get:d=>half(d.cat), fmt:d=>R(d.cat)},
    {k:"ecat", h:"Expected", exp:true, get:d=>half(d.ecat), fmt:d=>R(d.ecat)},
    {k:"cdraw", h:"Draw", get:d=>d.cdraw, fmt:d=>sign(d.cdraw,cSp),
     title:"Category wins gained or lost from who you were scheduled against"},
    {k:"wk", h:"Weeks", get:d=>half(d.wk), fmt:d=>R(d.wk)},
    {k:"ewk", h:"Expected", exp:true, get:d=>half(d.ewk), fmt:d=>R(d.ewk)},
    {k:"wdraw", h:"Draw", get:d=>d.wdraw, fmt:d=>sign(d.wdraw,wSp),
     title:"Weekly wins gained or lost from who you were scheduled against"},
    {k:"gb", h:"GB", get:d=>-d.gb, fmt:d=>d.gb===0?"\u2014":d.gb.toFixed(1)},
    {k:"egb", h:"Exp GB", exp:true, get:d=>d.egb==null?null:-d.egb,
     fmt:d=>d.egb==null?"\u2014":(d.egb===0?"\u2014":d.egb.toFixed(1)),
     title:"Games behind the best expected record, on the same arithmetic as GB"},
    {k:"run", h:"Best run", get:d=>d.run, fmt:d=>d.run},
    {k:"skid", h:"Worst skid", get:d=>-d.skid, fmt:d=>d.skid},
    {k:"first", h:"Wks 1st", get:d=>d.first, fmt:d=>d.first},
    {k:"form", h:"Last 5", cls:"form", fmt:d=>seasonForm(d.m)}
  ];
  if(sortCol){
    const c=COLS.find(x=>x.k===sortCol);
    if(c&&c.get) data.sort((x,y)=>{
      const a=c.get(x), b=c.get(y);
      if(a==null) return 1; if(b==null) return -1;
      return (c.text?String(a).localeCompare(String(b)):a-b)*sortDir;
    });
  }
  const ths=COLS.map(c=>{
    const on=c.k===sortCol, arrow=on?(sortDir<0?" \u25be":" \u25b4"):"";
    return `<th class="${c.cls||""}${c.exp?" exp":""}${c.get?" sortable":""}"${
      c.get?` data-c="${c.k}" role="button" tabindex="0"`:""}${
      c.title?` title="${esc(c.title)}"`:""}${on?` aria-sort="${sortDir<0?"descending":"ascending"}"`:""
      }>${c.h}${arrow}</th>`;}).join("");
  /* six of the ten make the playoffs, so the line sits between the sixth and
     seventh row whatever the table is sorted by */
  const CUT=6;
  const rows=data.map((d,i)=>`<tr class="${i===CUT-1?"cut":""}">${COLS.map(c=>
    `<td class="${c.cls||""}${c.exp?" exp":""}">${c.k==="m"?nameBtn(d.m):(c.fmt?c.fmt(d):"")}</td>`
  ).join("")}</tr>`).join("");
  el("v-standings").innerHTML=`<p class="lede">Expected is what your own numbers would have earned against each of the other nine managers rather than the one the schedule gave you. Draw is the difference, so it sums to zero across the league: every soft week you drew was a hard one for someone else. The gold line always sits between the sixth and seventh row, where the six-team playoff field is cut. Click a column to sort, or a name for that manager's page.</p>
    <div class="scroll fullbleed"><table class="stand"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>`;

    const go=()=>{const k=th.dataset.c;
      if(sortCol===k) sortDir=-sortDir; else {sortCol=k;sortDir=k==="m"?1:-1;}
      render();};
    th.onclick=go;
    th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
}
function vMatchups(){
  const S=D.seasons[season];
  const all=[...new Set(S.matchups.map(m=>m.week))].sort((a,b)=>a-b);
  const isPO=w=>S.matchups.some(m=>m.week===w&&m.stage!=="Regular");
  if(week===null||!all.includes(week)) week=all.filter(w=>!isPO(w)).pop()??all[all.length-1];
  if(!mTeam||!D.managers.includes(mTeam)) mTeam=D.managers[0];
  const detail=(D.weeklyDetail[season]||{});
  const nonScoring=new Set(D.nonScoring||[]);
  const CATS=D.cats.filter(c=>!nonScoring.has(c));
  const CIDX=CATS.map(c=>D.cats.indexOf(c));
  const live=new Set(((D.bracket&&D.bracket[season])||{}).live||[]);
  const realPO=m=>m.stage==="Regular"||live.has(`${m.week}|${m.a}|${m.b}`);

  const apBadge=(m,wk)=>{const ap=allPlayWeek(season,String(wk)); const r=ap&&ap[m];
    return r?`<button type="button" class="apw" data-ap="${esc(m)}" data-apw="${wk}" title="Record against the other nine managers this week. Click for the category detail.">${r.w}-${r.l}-${r.t}</button>`:"";};
  const PLUS_LBL={H:"Hitting+",P:"Pitching+"};
  const plusBadge=(m,wk,k)=>{const p=(plusWeek(season,String(wk))||{})[m];
    if(!p||p[k]==null) return "";
    return `<span class="grade ramped mini" style="background:${plusBg(p[k])}" title="${PLUS_LBL[k]}, week ${wk}. 100 is the league average for that week."><i>${k}</i>${plusFmt(p[k])}</span>`;};
  const gradeBadge=(m,wk)=>{const p=(plusWeek(season,String(wk))||{})[m];
    if(!p||p.G==null) return "";
    return `<span class="grade ramped" style="background:${plusBg(p.G)}" title="Week grade: this line ranked against the other nine managers across all 22 categories. 100 is the league average for that week.">${plusFmt(p.G)}</span>`;};

  /* shared expandable body: the plus split, then the full category line */
  function catBody(wk,a,b,gi){
    const da=detail[a]&&detail[a][wk], db=detail[b]&&detail[b][wk];
    if(!(da&&db&&da.opponent===b)) return "";
    const PW=plusWeek(season,String(wk))||{};
    const pa=PW[a], pb=PW[b];
    const AP=allPlayWeek(season,String(wk))||{};
    const chip=(lbl,v)=>`<span class="pl ramped"><i>${lbl}</i><b class="chip" style="background:${plusBg(v)}">${plusFmt(v)}</b></span>`;
    const splitRow=(pa&&pb)?`<div class="plusrow">
      ${[[a,pa],[b,pb]].map(([whoM,p])=>{const ap=AP[whoM];
        return `<div class="plusteam">
        <div class="pl-nm"><span class="dot" style="background:${col(whoM)}"></span>${esc(whoM)}</div>
        <div class="pl-pair">
          ${chip("Hitting+",p.H)}
          ${chip("Pitching+",p.P)}
          ${chip("Grade",p.G)}
          <span class="pl"><i>All-play</i><b>${ap?`${ap.w}-${ap.l}-${ap.t}`:"—"}</b></span>
        </div></div>`;}).join("")}
      <p class="note">Eleven hitting categories and eleven pitching, each scored against the other nine managers that week. 100 is the league average for the week, so a long week and a short week compare directly. All-play is that week's record against the other nine. Playoff weeks are scored the same way, against every team that played that week.</p>
    </div>`:"";
    const head=CATS.map(c=>`<th class="eq">${esc(c)}${lower.has(c)?" ↓":""}</th>`).join("");
    const line=(whoM,mine,other)=>`<tr><td class="l">${nameBtn(whoM)}</td>${
      CIDX.map((i,n)=>{
        const c=CATS[n], v=mine.you[i], o=other.you[i];
        let cls="eq";
        if(v!=null&&o!=null&&!isNaN(+v)&&!isNaN(+o)&&+v!==+o)
          cls+= (lower.has(c)? (+v<+o) : (+v>+o)) ? " catw" : " catl";
        return `<td class="${cls}">${fmtStat(c,v)}</td>`;}).join("")}</tr>`;
    return `<div class="catbox" id="cat-${gi}" hidden>${splitRow}<div class="scroll"><table class="catline"><thead><tr>
      <th class="l">Team</th>${head}</tr></thead><tbody>
      ${line(a,da,db)}${line(b,db,da)}</tbody></table></div></div>`;
  }

  const modeToggle=`<div class="toggle" role="group" aria-label="Matchup view">
    <button type="button" data-mm="week" aria-pressed="${mMode==="week"}">By week</button>

      all.map(w=>`<button type="button" data-w="${w}" class="${isPO(w)?"po":""}" aria-pressed="${w===week}">${w}</button>`).join("")}</div>`;

        <div class="side b"><div class="nm">${apBadge(m.b,week)}${gradeBadge(m.b,week)}${nameBtn(m.b)}</div>
          <div class="tm">${esc(S.teamNames[m.b]||"")}</div></div>
        ${grid?`<div style="grid-column:1/-1">${grid}</div>`:""}</div>`;

    lede=`Every matchup, week by week. The score is categories won. Beside each name is the week grade, where 100 is league average, and that week's record against the other nine managers. Tap a name badge for the all-play detail, or the matchup itself for the full category line. Playoff weeks are marked in gold, and show championship games only.`;
    body=`${picker}<div style="height:12px"></div><div class="games">${games||'<p class="empty">No games recorded.</p>'}</div>`;
  }else{
    const picker=`<div class="wk-pick team-pick" role="group" aria-label="Choose team">${
      D.managers.map(m=>`<button type="button" data-t="${esc(m)}" aria-pressed="${m===mTeam}">
        <span class="dot" style="background:${col(m)}"></span>${esc(m)}</button>`).join("")}</div>`;
    const mine=S.matchups.filter(m=>(m.a===mTeam||m.b===mTeam)&&realPO(m))
      .sort((p,q)=>p.week-q.week);
    let W=0,L=0,T=0,cw=0,cl=0,ct=0;
    const rows=mine.map((m,gi)=>{
      const home=m.a===mTeam;
      const opp=home?m.b:m.a;
      const mw=home?m.aw:m.al, ml=home?m.al:m.aw, mt=m.at??0;
      const res=mw>ml?"W":ml>mw?"L":"T";
      if(res==="W")W++;else if(res==="L")L++;else T++;
      cw+=mw; cl+=ml; ct+=mt;
      const grid=catBody(m.week,m.a,m.b,"t"+gi);
      const tag=m.stage!=="Regular"?`<span class="stagetag">${esc(m.stage)}</span>`:"";
      return `<div class="trow${grid?" clickable":""}"${grid?` data-g="t${gi}" tabindex="0" role="button" aria-expanded="false"`:""}>
        <div class="tr-main">
          <span class="tr-wk">${m.week}</span>
          <span class="tr-res ${res}">${res}</span>
          <span class="tr-sc">${mw}<i>–</i>${ml}</span>
          <span class="tr-opp">vs ${nameBtn(opp)}${tag}</span>
          <span class="tr-hp">${plusBadge(mTeam,m.week,"H")}</span>
          <span class="tr-hp">${plusBadge(mTeam,m.week,"P")}</span>
          <span class="tr-gr">${gradeBadge(mTeam,m.week)}</span>
          <span class="tr-ap">${apBadge(mTeam,m.week)}</span>

    }).join("");
    const seasonPlus=(()=>{
      const H=[],P=[],G=[];
      mine.forEach(m=>{const p=(plusWeek(season,String(m.week))||{})[mTeam];
        if(p){ if(p.H!=null)H.push(p.H); if(p.P!=null)P.push(p.P); if(p.G!=null)G.push(p.G);} });
      const av=a=>a.length?Math.round(a.reduce((s,v)=>s+v,0)/a.length):null;
      return {H:av(H),P:av(P),G:av(G)};
    })();
    const apTot=(()=>{let w=0,l=0,t=0;
      mine.forEach(m=>{const r=(allPlayWeek(season,String(m.week))||{})[mTeam];
        if(r){w+=r.w;l+=r.l;t+=r.t;}});
      return `${w}-${l}-${t}`;})();
    const summary=`<div class="tsum">
      <div class="ts"><i>Record</i><b>${W}-${L}-${T}</b></div>
      <div class="ts"><i>Categories</i><b>${cw}-${cl}-${ct}</b></div>
      <div class="ts"><i>All-play</i><b>${apTot}</b></div>
      <div class="ts"><i>Avg Hitting+</i><b>${seasonPlus.H??"—"}</b></div>
      <div class="ts"><i>Avg Pitching+</i><b>${seasonPlus.P??"—"}</b></div>
      <div class="ts g"><i>Avg grade</i><b>${seasonPlus.G??"—"}</b></div>

    lede=`One team's season in order. Beside each result are that week's Hitting+ and Pitching+, the overall grade, and the record against the other nine. Tap a row for the full category line.`;
    body=`${picker}
      <div class="teamhead"><span class="dot" style="background:${col(mTeam)}"></span>
        <b>${esc(mTeam)}</b><span class="tm">${esc(S.teamNames[mTeam]||"")}</span></div>
      ${summary}
      <div class="trows">${rows||'<p class="empty">No games recorded.</p>'}</div>`;
  }

  el("v-matchups").innerHTML=`<p class="lede tight">${lede}</p>${modeToggle}${body}`;

  const host=el("v-matchups");
  host.querySelector(".toggle").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    mMode=b.dataset.mm;render();};
  const wp=host.querySelector(".wk-pick");
  if(wp) wp.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.w!==undefined) week=+b.dataset.w; else if(b.dataset.t) mTeam=b.dataset.t;
    render();};
  host.querySelectorAll(".apw").forEach(btn=>{
    btn.onclick=ev=>{ ev.stopPropagation(); ev.preventDefault();
      const r=btn.getBoundingClientRect();
      openApPop(season,+btn.dataset.apw,btn.dataset.ap,r.left+r.width/2,r.bottom); };
  });
  host.querySelectorAll(".game.clickable,.trow.clickable").forEach(g=>{
    const box=g.querySelector(".catbox");
    const flip=ev=>{ if(ev.target.closest(".who")||ev.target.closest(".apw")) return;
      const open=!box.hidden; box.hidden=open; g.setAttribute("aria-expanded",String(!open)); };
    g.onclick=flip;
    g.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); flip(ev); } };
  });

function svgLine(o){
  const {series,labels,yMin,yMax,invert,yTitle}=o;
  const W=760,H=300,ml=46,mr=14,mt=12,mb=34,iw=W-ml-mr,ih=H-mt-mb,n=labels.length;
  const xAt=i=>ml+(n<=1?iw/2:iw*i/(n-1));
  const yAt=v=>{const t=(v-yMin)/((yMax-yMin)||1);return mt+(invert?t*ih:(1-t)*ih);};
  let g="";
  for(let k=0;k<=5;k++){const v=yMin+(yMax-yMin)*k/5,y=yAt(v);
    g+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.10)"/>`;
    g+=`<text x="${ml-8}" y="${(y+4).toFixed(1)}" fill="#828C84" font-size="11" text-anchor="end">${Math.round(v)}</text>`;}
  const step=n>16?Math.ceil(n/12):1;
  labels.forEach((lb,i)=>{if(i%step===0||i===n-1)
    g+=`<text x="${xAt(i).toFixed(1)}" y="${H-12}" fill="#828C84" font-size="11" text-anchor="middle">${lb}</text>`;});
  g+=`<text x="13" y="${(mt+ih/2).toFixed(1)}" fill="#828C84" font-size="11" text-anchor="middle" transform="rotate(-90 13 ${(mt+ih/2).toFixed(1)})">${yTitle}</text>`;
  let p="";
  series.forEach(s=>{if(s.hidden)return;
    p+=`<path d="${s.data.map((v,i)=>(i?"L":"M")+xAt(i).toFixed(1)+" "+yAt(v).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linejoin="round"/>`;
    const li=s.data.length-1;
    p+=`<circle cx="${xAt(li).toFixed(1)}" cy="${yAt(s.data[li]).toFixed(1)}" r="${s.width>2?3.5:2.5}" fill="${s.color}"/>`;});
  const shown=series.filter(s=>!s.hidden);
  let hit="";
  labels.forEach((lb,i)=>{
    const rows=shown.map(s=>({name:s.name||"",color:s.color,v:s.data[i],y:yAt(s.data[i])}))
      .sort((a,b)=>b.v-a.v);
    const payload=rows.map(r=>`${r.name}\u0001${r.color}\u0001${r.v}\u0001${r.y.toFixed(1)}`).join("\u0002");
    hit+=`<rect class="hit" x="${(xAt(i)-(iw/Math.max(1,n-1))/2).toFixed(1)}" y="${mt}"
      width="${(iw/Math.max(1,n-1)).toFixed(1)}" height="${ih}" fill="transparent"
      data-lb="${esc(String(lb))}" data-rows="${esc(payload)}"/>`;
    hit+=`<line class="guide" x1="${xAt(i).toFixed(1)}" y1="${mt}" x2="${xAt(i).toFixed(1)}" y2="${mt+ih}"
      stroke="rgba(255,255,255,.35)" stroke-width="1" style="display:none"/>`;
  });
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" data-h="${H}" role="img" style="width:100%;height:auto;display:block">${g}${p}${hit}</svg><div class="tip" hidden></div></div>`;
}
function movesChart(labels){
  const per=(D.moves&&D.moves[season])||null;
  if(!per) return "";
  const series=D.managers.map(m=>{let run=0;
    return {name:m,color:col(m),hidden:hidden.has(m),width:m==="Benny"?3:1.6,
      data:labels.map(w=>{const c=(per[m]||{})[String(w)];run+=c?c.add+c.drop:0;return run;})};});
  const peak=Math.max(10,...series.flatMap(s=>s.data));
  const totals=D.managers.map(m=>({m,n:labels.reduce((t,w)=>{
    const c=(per[m]||{})[String(w)];return t+(c?c.add+c.drop:0);},0)})).sort((a,b)=>b.n-a.n);
  return `<div class="chartbox"><h3>Roster moves, running total</h3>
    <p>Adds and drops combined, adding up as the season goes. Free agent and waiver moves only, so trades are not counted. Adds are capped at four a week by league rules.</p>
    ${svgLine({series,labels,yMin:0,yMax:Math.ceil(peak/10)*10,yTitle:"Moves"})}
    <p class="note">Season totals: ${totals.map(t=>`${esc(t.m)} ${t.n}`).join(" · ")}</p></div>`;
}

function wireHover(host){
  el(host).querySelectorAll(".chartwrap").forEach(wrap=>{
    const tip=wrap.querySelector(".tip"), svg=wrap.querySelector("svg");
    const guides=[...wrap.querySelectorAll(".guide")];
    const hits=[...wrap.querySelectorAll(".hit")];
    const VH=+(svg&&svg.getAttribute("data-h"))||300;
    const dot=document.createElement("div"); dot.className="hotdot"; dot.hidden=true;
    wrap.appendChild(dot);
    const hide=()=>{tip.hidden=true;dot.hidden=true;guides.forEach(g=>g.style.display="none");};
    hits.forEach((h,i)=>{
      const show=ev=>{
        const rows=(h.getAttribute("data-rows")||"").split("\u0002").filter(Boolean)
          .map(r=>r.split("\u0001"));
        if(!rows.length) return;
        const box=wrap.getBoundingClientRect();
        const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-box.left;
        const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-box.top;
        // cursor y in svg units, so we can find the line it is nearest
        const sy=cy/Math.max(1,box.height)*VH;
        let best=rows[0], bd=Infinity;
        rows.forEach(r=>{const d=Math.abs(parseFloat(r[3])-sy); if(d<bd){bd=d;best=r;}});
        guides.forEach((g,j)=>g.style.display=j===i?"":"none");
        const [nm,c,v]=best;
        tip.innerHTML=`<div class="tiphd">Week ${h.getAttribute("data-lb")}</div>
          <div class="tiprow"><span class="dot" style="background:${c}"></span>
            <span class="tn">${nm}</span><span class="tv">${v}</span></div>`;
        tip.hidden=false;
        // sit on whichever side of the cursor has room, so it never covers what you are reading
        const w=tip.offsetWidth||150;
        const left = (cx + 16 + w <= box.width) ? cx+16 : Math.max(4, cx-16-w);
        tip.style.left=left+"px";
        const ty=Math.max(4,Math.min(box.height-(tip.offsetHeight||44)-4, cy-22));
        tip.style.top=ty+"px";
        dot.style.left=(cx)+"px";
        dot.style.top=(parseFloat(best[3])/VH*box.height)+"px";
        dot.style.background=c; dot.hidden=false;
      };
      h.addEventListener("mousemove",show);
      h.addEventListener("touchstart",show,{passive:true});
    });
    wrap.addEventListener("mouseleave",hide);
  });
}

/* ---------- team stats (sortable) ---------- */
function vStats(){
  const S=D.seasons[season],ranks={},share={};
  const nonScoring=new Set(D.nonScoring||[]);
  const CATS=D.cats.filter(c=>!nonScoring.has(c));
  const CIDX=CATS.map(c=>D.cats.indexOf(c));
  const who=Object.keys(S.seasonStats);
  const SHOW=D.cats.filter(c=>!nonScoring.has(c));
  const SIDX=SHOW.map(c=>D.cats.indexOf(c));
  SHOW.forEach((c,jj)=>{const j=SIDX[jj];
    const pairs=who.map(m=>[m,parseFloat(S.seasonStats[m][j])]).filter(p=>!isNaN(p[1]));
    if(!pairs.length) return;
    const sorted=[...pairs].sort((a,b)=>lower.has(c)?a[1]-b[1]:b[1]-a[1]);
    sorted.forEach(([m],i)=>ranks[m+"|"+c]=i+1);
    const vals=pairs.map(p=>p[1]), lo=Math.min(...vals), hi=Math.max(...vals);
    pairs.forEach(([m,v])=>{
      // 1 == leads the league, 0 == trails, spaced by the actual gap
      let t = hi===lo ? 0.5 : (v-lo)/(hi-lo);
      share[m+"|"+c] = lower.has(c) ? 1-t : t;
    });
  });
  const pctl=(m,c)=>{const t=share[m+"|"+c]; return t==null?"":Math.round(t*100);};
  /* all-time record for each category: the single best figure any manager has
     put up in any season, so most seasons show none */
  const records={};
  SHOW.forEach((c,jj)=>{const j=SIDX[jj], lb=lower.has(c);
    let best=null;
    YEARS.forEach(s=>{const ss=D.seasons[s]&&D.seasons[s].seasonStats; if(!ss) return;
      Object.keys(ss).forEach(m=>{const v=parseFloat(ss[m][j]);
        if(isNaN(v)) return;
        if(best===null||(lb?v<best:v>best)) best=v;});});
    if(best!==null) records[c]=best;
  });
  const isRec=(c,v)=>records[c]!==undefined&&parseFloat(v)===records[c];
  let order=S.standings.map(r=>r.manager).filter(m=>S.seasonStats[m]);
  if(sortCol!==null){
    const j=sortCol;
    order=[...order].sort((a,b)=>{
      const va=S.seasonStats[a][j],vb=S.seasonStats[b][j];
      return (va-vb)*sortDir;
    });
  }
  const wideCat=c=>c==="IP";

/* one category, one manager, week by week */
const RATE_CATS=new Set(["AVG","OPS","ERA","WHIP","K/BB"]);
function openWeeklyPop(m,c,j,x,y){
  closePop();
  const all=(D.weeklyDetail||{})[season]||{};
  const det=all[m]||{};
  const wks=Object.keys(det).sort((a,b)=>a-b);
  if(!wks.length) return;
  const lb=lower.has(c);
  const vals=[];
  let cw=0,cl=0,ct=0;
  const cells=wks.map(w=>{
    const e=det[w], v=e&&e.you?e.you[j]:null;
    if(typeof v==="number"&&!isNaN(v)) vals.push(v);
    /* the result is this category against your opponent that week, not the matchup */
    let res="";
    const opp=e&&e.opponent, oe=opp&&all[opp]&&all[opp][w];
    const o=oe&&oe.you?oe.you[j]:null;
    if(typeof v==="number"&&typeof o==="number"&&!isNaN(v)&&!isNaN(o))
      res = v===o ? "T" : ((lb? v<o : v>o) ? "W" : "L");
    if(res==="W")cw++; else if(res==="L")cl++; else if(res==="T")ct++;
    return `<span class="wkc"><i>${w}</i><b>${v==null?"—":fmtStat(c,v)}</b>
      <u class="ap-${res}">${res||"·"}</u></span>`;}).join("");
  const rate=RATE_CATS.has(c);
  /* innings are decimal thirds, so they add up in outs, not as plain decimals */
  const sum=c==="IP"
    ? vals.reduce((s,v)=>s+Math.floor(v+1e-9)*3+Math.round((v-Math.floor(v+1e-9))*3),0)/3
    : vals.reduce((s,v)=>s+v,0);
  const agg=vals.length
    ? (rate?"avg "+fmtStat(c,vals.reduce((s,v)=>s+v,0)/vals.length):fmtStat(c,sum))
    : "—";
  const d=document.createElement("div");
  d.className="pop wkpop";
  d.innerHTML=`<button class="cls" aria-label="Close">×</button>
    <h4><span class="dot" style="background:${col(m)}"></span>${esc(m)}
      <span style="color:var(--bone-faint);font-size:12px">${esc(c)}${lb?" ↓":""} · ${esc(season)}</span></h4>
    <div class="wkgrid">${cells}</div>
    <div class="wkfoot"><span title="${rate?"A rate, so the weeks do not add up to the season figure; this averages them evenly.":"Across the weeks listed. The season total also counts weeks with no matchup, so it can run higher."}">${esc(agg)}</span><span title="Weeks won, lost and tied in ${esc(c)} against that week's opponent">${cw}-${cl}-${ct} in ${esc(c)}</span></div>`;
  document.body.appendChild(d);
  const bb=d.getBoundingClientRect();
  d.style.left=Math.min(Math.max(8,x-bb.width/2),window.innerWidth-bb.width-12)+"px";
  d.style.top=Math.min(y+12,Math.max(8,window.innerHeight-bb.height-12))+"px";
  d.querySelector(".cls").onclick=closePop;
}

/* ---------- radar: one season's category profile ----------
   Each axis is the share of the league that manager beat in that category
   that season, so 100 is the best in the league and 0 the worst. The four
   categories where a lower number is better are flipped, so further out is
   always better on both charts.                                            */
function pctlFor(sea){
  const S=D.seasons[sea]; if(!S||!S.seasonStats) return null;
  const skip=new Set(D.nonScoring||[]);
  const who=Object.keys(S.seasonStats);
  if(who.length<2) return null;
  const out={};
  D.cats.forEach((c,j)=>{
    if(skip.has(c)) return;
    const pairs=who.map(m=>[m,parseFloat(S.seasonStats[m][j])]).filter(p=>!isNaN(p[1]));
    if(pairs.length<2) return;
    const lb=lower.has(c);
    pairs.forEach(([m,v])=>{
      let beat=0,tie=0;
      pairs.forEach(([o,w])=>{ if(o===m) return;
        if(w===v) tie++; else if(lb? v<w : v>w) beat++; });
      out[m+"|"+c]=(beat+tie/2)/(pairs.length-1);
    });
  });
  return out;
}
function svgRadar(cats,pts,color){
  const W=300,H=276,cx=150,cy=134,R=88,n=cats.length;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n;
  const at=(i,r)=>[cx+Math.cos(ang(i))*R*r, cy+Math.sin(ang(i))*R*r];
  let g="";
  [0.25,0.5,0.75,1].forEach(r=>{
    g+=`<polygon points="${cats.map((_,i)=>at(i,r).map(v=>v.toFixed(1)).join(",")).join(" ")}"
      fill="none" stroke="rgba(255,255,255,${r===1?".24":".10"})"/>`;});
  cats.forEach((_,i)=>{const [x,y]=at(i,1);
    g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.10)"/>`;});
  const shape=pts.map((v,i)=>at(i,Math.max(0.03,v==null?0:v)).map(x=>x.toFixed(1)).join(",")).join(" ");
  let p=`<polygon points="${shape}" fill="${color}38" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((v,i)=>{const [x,y]=at(i,Math.max(0.03,v==null?0:v));
    p+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.7" fill="${color}"><title>${esc(cats[i])} — ${v==null?"no data":Math.round(v*100)}</title></circle>`;});
  let lb="";
  cats.forEach((c,i)=>{const [x,y]=at(i,1.21);
    const anchor=Math.abs(x-cx)<7?"middle":(x>cx?"start":"end");
    lb+=`<text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" fill="#828C84" font-size="10.5" text-anchor="${anchor}">${esc(c)}${lower.has(c)?" ↓":""}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" style="width:100%;height:auto;display:block">${g}${p}${lb}</svg>`;
}
function radarBlock(m){
  const sh=pctlFor(season);
  const S=D.seasons[season];
  if(!sh||!S.seasonStats||!S.seasonStats[m])
    return `<h2 class="sec">Category profile, ${esc(season)}</h2>
      <p class="empty">No season totals for ${esc(season)}.</p>`;
  const skip=new Set(D.nonScoring||[]);
  const HIT=D.cats.filter((c,i)=>i<D.hitN&&!skip.has(c));
  const PIT=D.cats.filter((c,i)=>i>=D.hitN&&!skip.has(c));
  const vals=cs=>cs.map(c=>{const t=sh[m+"|"+c]; return t==null?null:t;});
  const c=col(m);
  return `<h2 class="sec">Category profile, ${esc(season)}</h2>
    <p class="lede">Each spoke is the share of the league beaten in that category. Out at the rim is best in the league, in at the middle is worst. The four arrowed categories are flipped, so further out is always better.</p>
    <div class="radars">
      <div class="radar"><h3>Hitting</h3><p>${HIT.length} categories</p>${svgRadar(HIT,vals(HIT),c)}</div>
      <div class="radar"><h3>Pitching</h3><p>${PIT.length} categories</p>${svgRadar(PIT,vals(PIT),c)}</div>
    </div>`;
}

/* ---------- bracket ---------- */
function vBracket(){
  /* Rounds are worked out from the bracket itself rather than the stored game
     label: 2026 ran an extra regular season week, which pushed every round back
     one and left the stored labels a round ahead of reality. Only championship
     games count here; the consolation side shares the same weeks. */
  const br=(D.bracket&&D.bracket[season])||{};
  const isLive=new Set(br.live||[]);
  const post=D.postseason.filter(g=>g.season==+season&&g.stage==="Playoff"&&
    (isLive.has(`${g.week}|${g.winner}|${g.loser}`)||isLive.has(`${g.week}|${g.loser}|${g.winner}`)));
  if(!post.length){
    el("v-bracket").innerHTML=`<p class="lede">Championship bracket.</p>
      <p class="empty">No playoff results recorded for ${esc(season)} yet.</p>`;return;
  }
  /* 2026's seeds are carried on the bracket rather than in D.seeds */
  const seeds=Object.assign({},br.seeds||{},D.seeds[season]||{});
  const wks=[...new Set(post.map(g=>g.week))].sort((a,b)=>a-b);
  const atWk=w=>post.filter(g=>g.week===w);
  /* a round with a single game is the final; count back from there */
  let qf=[],sf=[],fin=null;
  const last=wks[wks.length-1];
  if(atWk(last).length===1){
    fin=atWk(last)[0];
    if(wks.length>=2) sf=atWk(wks[wks.length-2]);
    if(wks.length>=3) qf=atWk(wks[wks.length-3]);
  }else{
    sf=atWk(last);
    if(wks.length>=2) qf=atWk(wks[wks.length-2]);
  }
  const third=null;
  const inQF=new Set(qf.flatMap(g=>[g.winner,g.loser]));
  const byes=Object.keys(seeds).filter(m=>seeds[m]<=6&&!inQF.has(m)).sort((a,b)=>seeds[a]-seeds[b]);
  const sdOf=m=>seeds[m]||"";
  const tie=g=>{
    if(!g) return `<div class="byebox">—</div>`;
    const isTie=g.ws===g.ls;
    return `<div class="tie">
      <div class="row w"><span class="sd">${sdOf(g.winner)}</span><span class="dot" style="background:${col(g.winner)}"></span>
        <span class="nm">${nameBare(g.winner)}</span><span class="sc">${g.ws}</span></div>
      <div class="row lo"><span class="sd">${sdOf(g.loser)}</span><span class="dot" style="background:${col(g.loser)}"></span>
        <span class="nm">${nameBare(g.loser)}</span><span class="sc">${g.ls}</span></div>
      ${isTie?`<div class="tiebreak">Tied ${g.ws}–${g.ls}, decided on seed</div>`:""}</div>`;
  };
  const bye=m=>`<div class="byebox"><span class="sd" style="font-family:var(--cond);width:14px">${sdOf(m)}</span>
    <span class="dot" style="background:${col(m)}"></span>${nameBare(m)} <span style="margin-left:auto">bye</span></div>`;
  // true two-sided bracket: each half = bye + its quarterfinal, converging on the final
  const halves = sf.map(semi=>{
    const byeTeam = [semi.winner,semi.loser].find(m=>byes.includes(m)) || null;
    const other   = [semi.winner,semi.loser].find(m=>m!==byeTeam);
    const feeder  = qf.find(g=>g.winner===other) || null;
    return {byeTeam, feeder, semi};
  });
  while(halves.length<2) halves.push({byeTeam:null,feeder:null,semi:null});
  halves.sort((a,b)=>(seeds[a.byeTeam]||99)-(seeds[b.byeTeam]||99));
  const [H1,H2]=halves;
  const sideCol=(H,flip)=>`<div class="brcol">
      <div class="rndlbl">FIRST ROUND</div>
      ${H.byeTeam?bye(H.byeTeam):""}
      ${H.feeder?tie(H.feeder):""}</div>
    <div class="brcol"><div class="rndlbl">SEMIFINAL</div>${tie(H.semi)}</div>`;
  const pending=`<div class="byebox" style="justify-content:center">not played yet</div>`;
  el("v-bracket").innerHTML=`<p class="lede">Championship bracket. The top two seeds sat out the first round; the small number beside each name is their seed.${
    fin?"":` The ${esc(season)} final has not been played.`}</p>
    <div class="bracket bracket5">
      ${sideCol(H1)}
      <div class="brcol">
        <div class="rndlbl">FINAL</div>${fin?tie(fin):pending}
        ${fin?`<div class="champbox"><div class="lb">CHAMPION</div>
          <div class="nm"><span class="dot" style="background:${col(fin.winner)};width:12px;height:12px"></span>${esc(fin.winner)} \u{1F451}</div></div>`:""}
        ${third?`<div class="rndlbl" style="margin-top:14px">THIRD PLACE</div>${tie(third)}`:""}
      </div>
      <div class="brcol"><div class="rndlbl">SEMIFINAL</div>${tie(H2.semi)}</div>
      <div class="brcol">
        <div class="rndlbl">FIRST ROUND</div>
        ${H2.byeTeam?bye(H2.byeTeam):""}
        ${H2.feeder?tie(H2.feeder):""}</div>
    </div>`;
}

/* ---------- history ---------- */
/* Single-season category records: the best figure any manager has posted in
   one season, and who holds it. Same set the team stats page outlines. */
function allTimeRecords(){
  const skip=new Set(D.nonScoring||[]);
  const held={};
  D.cats.forEach((c,j)=>{
    if(skip.has(c)) return;
    const lb=lower.has(c);
    let best=null, who=[];
    YEARS.forEach(s=>{const ss=D.seasons[s]&&D.seasons[s].seasonStats; if(!ss) return;
      Object.keys(ss).forEach(m=>{const v=parseFloat(ss[m][j]);
        if(isNaN(v)) return;
        if(best===null||(lb?v<best:v>best)){best=v;who=[{m,s}];}
        else if(v===best) who.push({m,s});});});
    who.forEach(({m,s})=>{(held[m]=held[m]||[]).push({cat:c,season:s});});
  });
  return held;
}
/* Longest win run and worst losing skid across every season, regular season
   only, carrying straight over a season boundary. */
function allTimeStreaks(m){
  const g=[];
  SEASONS.forEach(s=>D.seasons[s].matchups.forEach(x=>{
    if(x.stage!=="Regular") return;
    if(x.a===m) g.push({s:+s,wk:x.week,w:x.aw,l:x.al});
    else if(x.b===m) g.push({s:+s,wk:x.week,w:x.al,l:x.aw});}));
  g.sort((a,b)=>a.s-b.s||a.wk-b.wk);
  let run=0,bestRun=0,skid=0,worstSkid=0;
  g.forEach(x=>{
    if(x.w>x.l){run++;bestRun=Math.max(bestRun,run);skid=0;}
    else if(x.l>x.w){skid++;worstSkid=Math.max(worstSkid,skid);run=0;}
    else {run=0;skid=0;}});
  return {run:bestRun,skid:worstSkid};
}
function vHistory(){
  const life=[...D.lifetime].sort((a,b)=>(b.matchPct||0)-(a.matchPct||0));
  const held=allTimeRecords();
  const lifeRows=life.map(r=>{
    const st=allTimeStreaks(r.manager);
    const mine=held[r.manager]||[];
    const recs=mine.length
      ? mine.map(x=>`<span class="rectag" title="${esc(x.cat)} record, set in ${esc(x.season)}">${esc(x.cat)}<i>${esc(String(x.season).slice(2))}</i></span>`).join("")
      : `<span class="sub">—</span>`;
    return `<tr><td class="l">${nameBtn(r.manager)}</td>
    <td>${rec(...r.cat)}</td><td>${rec(...r.match)}</td>
    <td>${st.run}</td><td>${st.skid}</td>
    <td class="l recs">${recs}</td></tr>`;}).join("");
  const pay=D.managers.map(m=>({m,...D.payouts[m]})).sort((a,b)=>b.total-a.total);
  const payRows=pay.map(p=>`<tr><td class="l">${nameBtn(p.m)}</td>${
    YEARS.map(s=>`<td>${p.bySeason[s]?"$"+p.bySeason[s]:"—"}</td>`).join("")}
    <td style="font-weight:600">${p.total?"$"+p.total.toLocaleString():"—"}</td></tr>`).join("");
  el("v-history").innerHTML=`<h2 class="sec">Lifetime records</h2>
    <p class="lede">Every regular season week and category, all seasons combined. Runs and skids carry straight across season boundaries. Held is every category where that manager owns the best single season the league has seen, with the year it was set.</p>
    <div class="scroll"><table><thead><tr><th class="l">Manager</th><th>Categories</th><th>Weeks</th>
      <th title="Longest run of winning weeks, all seasons">Best run</th>
      <th title="Longest run of losing weeks, all seasons">Worst skid</th>
      <th class="l">Records held</th></tr></thead><tbody>${lifeRows}</tbody></table></div>
    <h2 class="sec">Money</h2>
    <p class="lede">Regular season pays $${D.payoutRules.reg1} / $${D.payoutRules.reg2} / $${D.payoutRules.reg3}. The playoff champion takes $${D.payoutRules.champ}.</p>
    <div class="scroll"><table><thead><tr><th class="l">Manager</th>${YEARS.map(s=>`<th>${s}</th>`).join("")}<th>Total</th></tr></thead><tbody>${payRows}</tbody></table></div>
    <h2 class="sec">Head to head, regular season</h2><div id="h2h-reg"></div>
    <h2 class="sec">Head to head, playoffs</h2><div id="h2h-po"></div>`;
  h2hGrid(D.h2h, "Every pairing, regular season only, all seasons combined. Read across a row for that manager's record. Click any cell for the season by season breakdown.", "h2h-reg");
  if(D.h2hPlayoff) h2hGrid(D.h2hPlayoff, "Playoff and consolation games only. Most pairings never happened. Click a cell that has games for the detail.", "h2h-po", "po");
}

/* ---------- manager ---------- */
function playerBlocks(m){
  const P=(D.players||{})[m]||{};
  const Y=((D.playersBySeason||{})[season]||{})[m]||{};
  const li=(rows,fmt)=>rows&&rows.length?"<ol>"+rows.map(fmt).join("")+"</ol>"
    :'<p class="empty">Nothing yet.</p>';
  return `<h2 class="sec">Players in ${season}</h2>
  <div class="pcards">
    <div class="pcard"><h3>Draft, first picks</h3>
      ${li(Y.draft,r=>`<li>${esc(r.player)} <span class="sub">rd ${r.round}</span></li>`)}
      <p class="sub">${Y.draftTotal||0} picks in ${season}.</p></div>
    <div class="pcard"><h3>Added most in ${season}</h3>
      ${li(Y.added,r=>`<li>${esc(r.player)} <span class="sub">${r.n}\u00d7</span></li>`)}
      <p class="sub">${Y.addTotal||0} pickups in ${season}.</p></div>
    <div class="pcard"><h3>Drafted every year</h3>
      ${li(P.draftedRepeat,r=>`<li>${esc(r.player)} <span class="sub">${r.seasons.join(", ")}</span></li>`)}
      <p class="sub">All seasons. Taken in more than one draft.</p></div>
    <div class="pcard"><h3>Added most, all seasons</h3>
      ${li(P.added,r=>`<li>${esc(r.player)} <span class="sub">${r.n}\u00d7</span></li>`)}
      <p class="sub">${P.draftCount||0} career draft picks.</p></div>
  </div>`;
}

function tradeBlock(m){
  const all=(D.trades||[]).filter(t=>t.parties.includes(m));
  if(!all.length) return `<h2 class="sec">Trades</h2><p class="empty">No trades on record.</p>`;
  const byYear={};
  all.forEach(t=>{(byYear[t.season]=byYear[t.season]||[]).push(t);});
  const blocks=Object.keys(byYear).sort((a,b)=>b-a).map(y=>{
    const rows=byYear[y].slice().sort((a,b)=>b.ts-a.ts).map(t=>{
      const other=t.parties.filter(p=>p!==m);
      const got=(t.got[m]||[]).map(p=>esc(p.player)).join(", ")||"\u2014";
      const gave=other.flatMap(o=>(t.got[o]||[]).map(p=>esc(p.player))).join(", ")||"\u2014";
      const d=new Date(t.ts*1000);
      const when=isNaN(d)?"\u2014":d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
      return `<tr><td>${when}</td><td class="l">${other.map(nameBtn).join(", ")}</td>
        <td class="l">${got}</td><td class="l">${gave}</td></tr>`;}).join("");
    return `<h3 class="yrhead">${y}<span class="sub">${byYear[y].length} trade${byYear[y].length>1?"s":""}</span></h3>
      <div class="scroll"><table><thead><tr><th>Date</th><th class="l">With</th>
        <th class="l">Received</th><th class="l">Sent</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  return `<h2 class="sec">Trades</h2>
    <p class="lede">${all.length} trade${all.length>1?"s":""} on record, newest season first.</p>${blocks}`;
}

function vManager(){
  if(!who){el("v-manager").innerHTML=`<p class="empty">Pick a manager.</p>`;return;}
  const life=D.lifetime.find(x=>x.manager===who);
  const reg=[];
  SEASONS.forEach(s=>D.seasons[s].matchups.forEach(m=>{
    if(m.stage!=="Regular")return;
    if(m.a===who)reg.push({s:+s,wk:m.week,opp:m.b,w:m.aw,l:m.al});
    else if(m.b===who)reg.push({s:+s,wk:m.week,opp:m.a,w:m.al,l:m.aw});}));
  reg.sort((a,b)=>a.s-b.s||a.wk-b.wk);
  const best=reg.reduce((a,b)=>(b.w-b.l)>(a.w-a.l)?b:a);
  const worst=reg.reduce((a,b)=>(b.w-b.l)<(a.w-a.l)?b:a);
  let cur=0,bestStreak=0;reg.forEach(g=>{if(g.w>g.l){cur++;bestStreak=Math.max(bestStreak,cur);}else cur=0;});
  const titles=SEASONS.filter(s=>(D.finalPlace[s]||[])[0]===who).length;
  const reg1=SEASONS.filter(s=>D.seasons[s].standings[0].manager===who).length;
  const pay=D.payouts[who];
  const names=[];SEASONS.forEach(s=>{const n=D.seasons[s].teamNames[who];
    if(!names.length||names[names.length-1].n!==n)names.push({from:s,to:s,n});else names[names.length-1].to=s;});
  const finishes=SEASONS.map(s=>{
    const st=D.seasons[s].standings,i=st.findIndex(r=>r.manager===who),r=st[i];
    const fin=(D.finalPlace[s]||[]).indexOf(who);
    return `<tr><td class="l">${s}</td><td class="l sub">${esc(D.seasons[s].teamNames[who])}</td>
      <td style="background:${heat(i/9)}">${i+1}</td><td>${rec(r.w,r.l,r.t)}</td><td>${pct3(r.pct)}</td>
      <td>${rec(r.mw,r.ml,r.mt)}</td><td>${fin>=0?fin+1:"—"}</td>
      <td>${pay.bySeason[s]?"$"+pay.bySeason[s]:"—"}</td></tr>`;}).join("");
  const opps=D.managers.filter(m=>m!==who).map(m=>{
    const r=D.h2h[who][m],tot=r.w+r.l+r.t,s=tot?(r.w+r.t/2)/tot:.5;return {m,r,s};})
    .sort((a,b)=>b.s-a.s);
  const oppRows=opps.map(o=>{
    const c=(D.h2hCats&&D.h2hCats[who]&&D.h2hCats[who][o.m])||null;
    const cn=c?c.w+c.l+c.t:0, cp=cn?(c.w+c.t/2)/cn:null;
    return `<tr><td class="l">${nameBtn(o.m)}</td>
    <td class="cell ${o.r.w>o.r.l?"w":o.r.l>o.r.w?"l":"e"}" style="background:${o.r.w>o.r.l?"rgba(196,47,69,.42)":o.r.l>o.r.w?"rgba(49,89,158,.42)":"rgba(255,255,255,.10)"}">${rec(o.r.w,o.r.l,o.r.t)}</td>
    <td>${pct3(o.s)}</td>
    <td>${c?rec(c.w,c.l,c.t):"\u2014"}</td>
    <td>${cp==null?"\u2014":pct3(cp)}</td></tr>`;}).join("");
  el("v-manager").innerHTML=`
    <button type="button" class="back" id="mgBack">← Back</button>
    <div class="mghead"><span class="dot" style="background:${col(who)};width:20px;height:20px"></span>
      <span class="mgname">${esc(who)}</span><span>${crowns(who)}</span></div>
    <p class="lede">${esc(D.seasons[String(D.meta.currentSeason)].teamNames[who])} — four seasons in The Frank Cup.</p>
    <div class="kpis">
      <div class="kpi"><div class="k">WEEKS W-L-T</div><div class="v">${rec(...life.match)}</div></div>
      <div class="kpi"><div class="k">WIN PCT</div><div class="v">${pct3(life.matchPct)}</div></div>
      <div class="kpi"><div class="k">CATEGORIES</div><div class="v">${rec(...life.cat)}</div></div>
      <div class="kpi"><div class="k">TITLES</div><div class="v">${titles}</div></div>
      <div class="kpi"><div class="k">REG. SEASON #1</div><div class="v">${reg1}</div></div>
      <div class="kpi"><div class="k">EARNINGS</div><div class="v">${pay.total?"$"+pay.total.toLocaleString():"$0"}</div></div>
      <div class="kpi"><div class="k">LONGEST RUN</div><div class="v">${bestStreak}<span style="font-size:13px;color:var(--bone-faint)"> wks</span></div></div>
      <div class="kpi"><div class="k">BEST WEEK</div><div class="v">${best.w}–${best.l}</div><div class="sub">${best.s} wk ${best.wk} v ${esc(best.opp)}</div></div>
      <div class="kpi"><div class="k">WORST WEEK</div><div class="v">${worst.w}–${worst.l}</div><div class="sub">${worst.s} wk ${worst.wk} v ${esc(worst.opp)}</div></div>
    </div>
    ${radarBlock(who)}
    <h2 class="sec">Season by season</h2>
    <div class="scroll"><table><thead><tr><th class="l">Season</th><th class="l">Team</th><th>Reg. finish</th>
      <th>Categories</th><th>Pct</th><th>Weeks</th><th>Final</th><th>Won</th></tr></thead><tbody>${finishes}</tbody></table></div>
    <h2 class="sec">Team name history</h2>
    <div>${names.map(n=>`<div class="namerow"><span class="yr">${n.from===n.to?n.from:n.from+"–"+n.to}</span><span>${esc(n.n)}</span></div>`).join("")}</div>
    <h2 class="sec">Against everyone else</h2>
    <p class="lede">Regular season only, all four seasons. Weeks is the matchup record, categories is every individual category across those weeks.</p>
    <div class="scroll"><table><thead><tr><th class="l">Opponent</th><th>Weeks</th><th>Pct</th>
      <th>Categories</th><th>Pct</th></tr></thead><tbody>${oppRows}</tbody></table></div>
    ${playerBlocks(who)}
    ${tradeBlock(who)}`;
  el("mgBack").onclick=()=>{view=backTo;render();};
}

function render(){
  document.body.setAttribute("data-season",season);
  closePop();
  document.body.setAttribute("data-season",season);
  el("parkName").textContent=PARK_NAMES[season]||"";
  el("seasonPick").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===season));
  el("nav").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view?"page":"false"));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  el("v-"+view).classList.add("on");
  ({standings:vStandings,matchups:vMatchups,trends:vTrends,stats:vStats,
    bracket:vBracket,history:vHistory,manager:vManager})[view]();
}
buildChrome();render();
})();
</script>
</body>
</html>

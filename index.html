<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Frank Cup</title>
<style>
:root{
  --field:#0B1610; --housing:#111E16;
  --panel:rgba(255,255,255,.05); --rule:rgba(255,255,255,.15);
  --bone:#EDEAE0; --bone-dim:#B2BAB1; --bone-faint:#828C84;
  --bulb:#E8A62E;
  --hot:#D22D49; --cold:#3661AD;
  --win:#C42F45; --loss:#31599E;
  --cond:"Haettenschweiler","Arial Narrow Bold","Arial Narrow",Impact,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--field);color:var(--bone);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;position:relative;min-height:100vh}
body>*{position:relative;z-index:1}
h1,h2,h3{font-family:var(--cond);font-weight:500;letter-spacing:.02em;margin:0}
button{font-family:inherit}

.board{background:var(--housing);border-bottom:3px solid var(--rule);padding:16px 20px 0;position:sticky;top:0;z-index:30}
.board-top{max-width:1200px;margin:0 auto;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.mark{font-family:var(--cond);font-size:30px;line-height:1;letter-spacing:.07em}
.mark span{color:var(--bulb)}
.parkname{font-size:12px;color:var(--bone-faint);letter-spacing:.04em}
.season-pick{display:flex;margin-left:auto;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.season-pick button{font-family:var(--cond);font-size:16px;letter-spacing:.05em;background:transparent;
  color:var(--bone-dim);border:0;padding:7px 15px;cursor:pointer;border-right:1px solid var(--rule)}
.season-pick button:last-child{border-right:0}
.season-pick button[aria-pressed="true"]{background:var(--bulb);color:#241A05}
.season-pick button:focus-visible{outline:2px solid var(--bone);outline-offset:-2px}
nav{max-width:1200px;margin:12px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font-family:var(--cond);font-size:15px;letter-spacing:.06em;white-space:nowrap;background:transparent;
  border:0;border-bottom:3px solid transparent;color:var(--bone-faint);padding:9px 15px;cursor:pointer}
nav button[aria-current="page"]{color:var(--bone);border-bottom-color:var(--bulb)}
nav button:focus-visible{outline:2px solid var(--bulb);outline-offset:-3px}

main{max-width:1200px;margin:0 auto;padding:26px 20px 90px}
.view{display:none}.view.on{display:block}
.lede{color:var(--bone-dim);max-width:66ch;margin:0 0 20px;font-size:14px}
h2.sec{font-size:20px;letter-spacing:.05em;margin:34px 0 12px}
h2.sec:first-child{margin-top:0}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:rgba(10,16,12,.72);border:1px solid var(--rule);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-family:var(--cond);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--bone-faint);
  position:sticky;top:0;background:var(--housing);z-index:2}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
tbody tr:hover{background:rgba(255,255,255,.05)}
.rk{color:var(--bone-faint);font-family:var(--cond);font-size:14px;width:1%}
.dot{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:8px;flex:none}
.sub{color:var(--bone-faint);font-size:12px}
.who{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;cursor:pointer;
  border-bottom:1px dotted transparent;display:inline-flex;align-items:center;gap:0}
.who:hover{border-bottom-color:currentColor}
.who:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.crown{margin-left:6px;font-size:13px;line-height:1;flex:none}
.crown.reg{filter:saturate(.2) brightness(1.4)}

th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--bone)}
th.sortable[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
th.sortable[aria-sort="descending"]::after{content:" ▼";font-size:9px}
th.eq,td.eq{width:60px;min-width:60px;max-width:60px;overflow:hidden;text-overflow:ellipsis}

.form span{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;
  font-size:10px;font-weight:700;border-radius:2px;margin-right:2px;color:#0B0F0C}
.form .w{background:var(--win);color:#fff}
.form .l{background:var(--loss);color:#fff}
.form .t{background:rgba(255,255,255,.28);color:var(--bone)}

.toggle{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin-bottom:14px}
.toggle button{font-family:var(--cond);font-size:14px;letter-spacing:.05em;background:transparent;
  color:var(--bone-dim);border:0;padding:6px 14px;cursor:pointer;border-right:1px solid var(--rule)}
.toggle button:last-child{border-right:0}
.toggle button[aria-pressed="true"]{background:var(--bulb);color:#241A05}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bone-faint);margin:0 0 14px;flex-wrap:wrap}
.ramp .strip{height:10px;width:150px;border-radius:1px;
  background:linear-gradient(90deg,var(--cold),rgba(255,255,255,.12),var(--hot))}
.key{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
.key i{width:11px;height:11px;border-radius:2px;display:inline-block;font-style:normal}

.wk-pick{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;align-items:center}
.wk-pick button{font-family:var(--cond);font-size:14px;min-width:38px;background:var(--panel);
  border:1px solid var(--rule);color:var(--bone-dim);padding:6px 9px;cursor:pointer;border-radius:2px}
.wk-pick button[aria-pressed="true"]{background:var(--bulb);color:#241A05;border-color:var(--bulb)}
.wk-pick button.po{border-color:var(--bulb);color:var(--bulb)}
.wk-pick button.po[aria-pressed="true"]{background:var(--bulb);color:#241A05}
.wk-div{width:1px;height:22px;background:var(--rule);margin:0 6px}
.wk-lbl{font-family:var(--cond);font-size:12px;letter-spacing:.09em;color:var(--bulb)}
.games{display:grid;gap:10px}
.game{background:rgba(10,16,12,.74);border:1px solid var(--rule);border-radius:3px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:14px 16px}
.side{min-width:0}.side.b{text-align:right}
.side .nm{font-weight:600;font-size:15px;display:flex;align-items:center}
.side.b .nm{justify-content:flex-end}
.side .tm{color:var(--bone-faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally{font-family:var(--cond);font-size:28px;line-height:1;white-space:nowrap;padding:0 4px}
.tally .v{color:var(--bone-faint)}.tally .v.win{color:var(--bone)}
.tally i{color:var(--bone-faint);font-size:15px;font-style:normal;padding:0 5px}
.stagetag{font-family:var(--cond);font-size:12px;letter-spacing:.08em;color:var(--bulb);
  border:1px solid var(--bulb);border-radius:2px;padding:0 6px;margin-left:8px}
.detail{margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
.detail summary{cursor:pointer;font-family:var(--cond);font-size:13px;letter-spacing:.07em;color:var(--bulb)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:1px;margin-top:12px;background:var(--rule)}
.cat{background:var(--housing);padding:7px 9px}
.cat .k{font-family:var(--cond);font-size:12px;letter-spacing:.08em;color:var(--bone-faint)}
.cat .val{font-size:15px;font-weight:600}

.chartbox{background:rgba(10,16,12,.74);border:1px solid var(--rule);border-radius:3px;padding:14px;margin-bottom:16px}
.chartbox h3{font-size:16px;letter-spacing:.04em}
.chartbox p{margin:0 0 12px;color:var(--bone-faint);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:14px}
.legend button{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--bone-dim);
  font-size:13px;cursor:pointer;padding:2px 0}
.legend button[aria-pressed="false"]{opacity:.30}
.hm td.c{padding:5px 0;text-align:center;font-size:12px;min-width:26px}

/* head to head */
.h2h td.cell{cursor:pointer;font-weight:600}
.h2h td.cell.w{background:rgba(196,47,69,.42)}
.h2h td.cell.l{background:rgba(49,89,158,.42)}
.h2h td.cell.e{background:rgba(255,255,255,.10)}
.h2h td.cell:hover{outline:2px solid var(--bulb);outline-offset:-2px}
.pop{position:fixed;z-index:60;background:var(--housing);border:1px solid var(--bulb);border-radius:4px;
  box-shadow:0 10px 34px rgba(0,0,0,.6);padding:12px 14px;min-width:236px;font-size:13px}
.pop h4{font-family:var(--cond);font-size:15px;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pop table{width:100%;font-size:13px}
.pop th,.pop td{padding:4px 6px;border-bottom:1px solid var(--rule);position:static;background:none}
.pop .cls{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--bone-faint);cursor:pointer;font-size:15px}

/* bracket */
.bracket{display:grid;gap:14px;align-items:center;overflow-x:auto;padding:4px 0 8px}
.bracket5{grid-template-columns:1.05fr 1fr 1.15fr 1fr 1.05fr}
.brcol{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-height:330px}
.rndlbl{font-family:var(--cond);font-size:12px;letter-spacing:.11em;color:var(--bone-faint);text-align:center;margin-bottom:4px}
.tie{border:1px solid var(--rule);border-radius:3px;background:rgba(10,16,12,.8);overflow:hidden}
.tie .row{display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:13px}
.tie .row+.row{border-top:1px solid var(--rule)}
.tie .row.w{background:rgba(196,47,69,.26)}
.tie .row .sd{font-family:var(--cond);font-size:12px;color:var(--bone-faint);width:14px;flex:none}
.tie .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tie .row .sc{font-family:var(--cond);font-size:18px;flex:none}
.tie .row.lo{color:var(--bone-faint)}
.tie .tiebreak{font-size:11px;color:var(--bulb);padding:5px 9px;border-top:1px solid var(--rule)}
.byebox{border:1px dashed var(--rule);border-radius:3px;padding:7px 9px;font-size:13px;color:var(--bone-faint);
  display:flex;align-items:center;gap:7px}
.champbox{border:1px solid var(--bulb);border-radius:3px;padding:14px 10px;text-align:center;background:rgba(232,166,46,.12)}
.champbox .lb{font-family:var(--cond);font-size:12px;letter-spacing:.13em;color:var(--bulb)}
.champbox .nm{font-family:var(--cond);font-size:26px;margin-top:3px;display:flex;justify-content:center;align-items:center;gap:6px}

/* manager */
.mghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mgname{font-family:var(--cond);font-size:38px;line-height:1;letter-spacing:.03em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;margin:18px 0 8px;overflow:hidden}
.kpi{background:rgba(10,16,12,.85);padding:12px 13px}
.kpi .k{font-family:var(--cond);font-size:12px;letter-spacing:.08em;color:var(--bone-faint)}
.kpi .v{font-family:var(--cond);font-size:23px;line-height:1.15;margin-top:3px}
.namerow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.namerow .yr{font-family:var(--cond);color:var(--bone-faint);width:70px;flex:none}
.back{background:transparent;border:1px solid var(--rule);color:var(--bone-dim);border-radius:2px;
  padding:5px 11px;font-size:13px;cursor:pointer;margin-bottom:16px}

.note{background:rgba(10,16,12,.74);border-left:3px solid var(--bulb);padding:11px 14px;font-size:13px;
  color:var(--bone-dim);margin:18px 0;border-radius:0 2px 2px 0}
.empty{color:var(--bone-faint);padding:26px 0;font-size:14px}
footer{border-top:1px solid var(--rule);color:var(--bone-faint);font-size:12px;padding:18px 20px 40px;max-width:1200px;margin:0 auto}

@media (max-width:760px){
  .mark{font-size:23px}main{padding:20px 14px 70px}.board{padding:14px 14px 0}
  .season-pick{margin-left:0;width:100%}.season-pick button{flex:1}
  th,td{padding:7px 6px;font-size:13px}
  .game{padding:12px;gap:4px}.tally{font-size:22px}.side .nm{font-size:13px}
  .bracket{grid-template-columns:repeat(5,minmax(148px,1fr));gap:10px}
  .mgname{font-size:29px}
  th.eq,td.eq{width:54px;min-width:54px;max-width:54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body[data-season="2023"]{--field:#0C1712;--housing:#10201A}
body[data-season="2024"]{--field:#0B1420;--housing:#101D2B}
body[data-season="2025"]{--field:#17100E;--housing:#211714}
body[data-season="2026"]{--field:#0E1020;--housing:#15182C}
body[data-season="ALL"]{--field:#0F0F11;--housing:#191A1D}
body{background:var(--field)}

table.catline td.catw{background:rgba(62,140,84,.30);font-weight:600}
table.catline td.catl{color:var(--bone-faint)}
table.catline th.ns,table.catline td.ns{color:var(--bone-faint)}
.catbox{margin-top:10px}
.catbox .note{margin:6px 0 0;font-size:11.5px;color:var(--bone-faint)}
#seasonPick button[disabled]{opacity:.35;cursor:not-allowed}

.game.clickable{cursor:pointer}
.game.clickable:hover{background:rgba(255,255,255,.04)}
.game.clickable:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

table th,table td{text-align:center !important;vertical-align:middle}
table th.l,table td.l{text-align:center !important;white-space:normal}
table td.l .who,table td.l button{display:inline-block;white-space:nowrap}
table.h2h th,table.h2h td{min-width:62px}
table.h2h td.l,table td.l{min-width:104px}
.form{justify-content:center;display:flex;gap:3px}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:rgba(255,255,255,.05);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;text-align:left}
.pcard h3{margin:0 0 8px;font-size:15px;letter-spacing:.05em;color:var(--bulb)}
.pcard ol{margin:0;padding-left:20px}
.pcard li{font-size:13.5px;margin:3px 0}
.pcard .sub{display:block;margin-top:8px;font-size:11.5px;color:var(--bone-faint)}
.pcard li .sub{display:inline;margin:0}

.chartwrap{position:relative}
.chartwrap .tip{position:absolute;top:8px;background:var(--housing);border:1px solid var(--rule);
  border-radius:3px;padding:7px 9px;font-size:12px;pointer-events:none;min-width:150px;z-index:5;text-align:left}
.chartwrap .tiphd{font-family:var(--cond);letter-spacing:.05em;color:var(--bone-faint);margin-bottom:4px}
.chartwrap .tiprow{display:flex;align-items:center;gap:6px;line-height:1.5}
.chartwrap .tiprow .dot{width:8px;height:8px;border-radius:2px;flex:none}
.chartwrap .tiprow .tn{flex:1}
.chartwrap .tiprow .tv{font-variant-numeric:tabular-nums;color:var(--bone)}
th.exp,td.exp{color:var(--bone-dim);background:rgba(255,255,255,.035)}
.yrhead{font-family:var(--cond);font-size:17px;letter-spacing:.05em;margin:18px 0 6px;
  display:flex;gap:10px;align-items:baseline;justify-content:center}
.yrhead .sub{font-size:11.5px;color:var(--bone-faint)}
</style>
</head>

<script>
const PARK_NAMES = {};
(function(){
const D=LEAGUE_DATA, ALLK=D.allTimeKey||"ALL", SEASONS=Object.keys(D.seasons).sort(),
  YEARS=Object.keys(D.seasons).filter(s=>s!==(D.allTimeKey||"ALL")).sort();
let season=String(D.meta.currentSeason), view="standings";
let week=null, statMode="raw", who=null, backTo="standings";
let sortCol=null, sortDir=-1;
const hidden=new Set(), lower=new Set(D.lowerBetter);

const col=m=>"#"+D.colors[m];
const rec=(w,l,t)=>w+"-"+l+"-"+t;
const pct3=p=>p.toFixed(3).replace(/^0/,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=id=>document.getElementById(id);
const VIEWS=[["standings","Standings"],["matchups","Matchups"],["trends","Trends"],
 ["stats","Team stats"],["bracket","Bracket"],["history","History"]];

/* innings: decimal thirds -> baseball notation */
function ipFmt(v){
  const whole=Math.floor(v+1e-9);
  const outs=Math.round((v-whole)*3);
  return outs>=3 ? (whole+1)+".0" : whole+"."+outs;
}
function fmtStat(c,v){
  if(v==null) return "—";
  if(c==="AVG"||c==="OPS") return Number(v).toFixed(3).replace(/^0/,"");
  if(c==="ERA"||c==="WHIP"||c==="K/BB") return Number(v).toFixed(2);
  if(c==="IP") return ipFmt(Number(v));
  return v;
}
function heat(t){
  const a=[210,45,73],b=[54,97,173],m=[255,255,255];
  let c,al;
  if(t<0.5){const k=t/0.5;c=a.map((v,i)=>v+(m[i]-v)*k);al=0.62-0.42*k;}
  else{const k=(t-0.5)/0.5;c=m.map((v,i)=>v+(b[i]-v)*k);al=0.20+0.42*k;}
  return `rgba(${c.map(Math.round).join(",")},${al.toFixed(2)})`;
}

/* crowns for the selected season */
function crowns(m){
  const regChamp = D.seasons[season].standings[0].manager===m;
  const poChamp = (D.finalPlace[season]||[])[0]===m;
  let s="";
  if(regChamp) s+=`<span class="crown reg" title="Regular season champion, ${season}" aria-label="Regular season champion">🏵</span>`;
  if(poChamp) s+=`<span class="crown" title="Playoff champion, ${season}" aria-label="Playoff champion">👑</span>`;
  return s;
}
const nameBtn=m=>`<button type="button" class="who" data-mgr="${esc(m)}">
  <span class="dot" style="background:${col(m)}"></span>${esc(m)}${crowns(m)}</button>`;
const nameBare=m=>`<button type="button" class="who" data-mgr="${esc(m)}">${esc(m)}${crowns(m)}</button>`;

function buildChrome(){
  el("seasonPick").innerHTML=SEASONS.map(s=>`<button type="button" data-s="${s}" aria-pressed="${s===season}">${s}</button>`).join("");
  el("seasonPick").onclick=e=>{const b=e.target.closest("button");if(!b)return;season=b.dataset.s;week=null;sortCol=null;render();};
  el("nav").innerHTML=VIEWS.map(([k,l])=>`<button type="button" data-v="${k}" aria-current="${k===view?"page":"false"}">${l}</button>`).join("");
  el("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;sortCol=null;render();};
  el("foot").innerHTML=esc(D.meta.note)+" 🏵 regular-season champion · 👑 playoff champion.";
  document.addEventListener("click",e=>{
    const b=e.target.closest(".who");
    if(b){who=b.dataset.mgr;backTo=view==="manager"?backTo:view;view="manager";render();return;}
    if(!e.target.closest(".pop")&&!e.target.closest(".cell")) closePop();
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop();});
}

/* ---------- standings ---------- */
function seasonForm(m){
  const S=D.seasons[season];
  const g=S.matchups.filter(x=>x.stage==="Regular"&&(x.a===m||x.b===m))
    .map(x=>x.a===m?{w:x.aw,l:x.al}:{w:x.al,l:x.aw})
    .slice(-5);
  return g.map(x=>x.w>x.l?'<span class="w">W</span>':x.w<x.l?'<span class="l">L</span>':'<span class="t">T</span>').join("");
}
function longestSkid(m){
  const S=D.seasons[season];
  const g=S.matchups.filter(x=>x.stage==="Regular"&&(x.a===m||x.b===m))
    .sort((p,q)=>(p.season||0)-(q.season||0)||p.week-q.week)
    .map(x=>x.a===m?{w:x.aw,l:x.al}:{w:x.al,l:x.aw});
  let cur=0,best=0;
  g.forEach(x=>{if(x.l>x.w){cur++;best=Math.max(best,cur);}else cur=0;});
  return best;
}
function longestStreak(m){
  const S=D.seasons[season];
  const g=S.matchups.filter(x=>x.stage==="Regular"&&(x.a===m||x.b===m))
    .sort((p,q)=>(p.season||0)-(q.season||0)||p.week-q.week).map(x=>x.a===m?{w:x.aw,l:x.al}:{w:x.al,l:x.aw});
  let cur=0,best=0;
  g.forEach(x=>{if(x.w>x.l){cur++;best=Math.max(best,cur);}else cur=0;});
  return best;
}
function weeksInFirst(m){
  return D.seasons[season].progression.filter(p=>p.rank[m]===1).length;
}
function vStandings(){
  const S=D.seasons[season];
  const catAP=(D.allPlay&&D.allPlay[season]&&D.allPlay[season].season)||{};
  const wkAP=(D.weekAllPlay&&D.weekAllPlay[season]&&D.weekAllPlay[season].season)||{};
  const rate=o=>{if(!o)return null;const n=o.w+o.l+o.t;return n?(o.w+o.t/2)/n:null;};
  const rows=S.standings.map((r,i)=>{
    const games=r.mw+r.ml+r.mt;
    const cats=r.w+r.l+r.t;
    const cp=rate(catAP[r.manager]);            // share of every category v everyone
    const wp=rate(wkAP[r.manager]);             // share of weeks v a random opponent
    const expCatW = cp==null?null:Math.round(cp*cats);
    const expWkW  = wp==null?null:wp*games;
    const luckG   = expWkW==null?null:(r.mw+r.mt/2)-expWkW;
    const own     = games?(r.mw+r.mt/2)/games:null;
    return `<tr>
      <td class="rk">${i+1}</td>
      <td class="l">${nameBtn(r.manager)}</td>
      <td>${rec(r.w,r.l,r.t)}</td>
      <td class="exp">${expCatW==null?"\u2014":`${expCatW}-${cats-expCatW}`}</td>
      <td>${pct3(r.pct)}</td>
      <td class="exp">${cp==null?"\u2014":pct3(cp)}</td>
      <td>${rec(r.mw,r.ml,r.mt)}</td>
      <td class="exp">${expWkW==null?"\u2014":`${expWkW.toFixed(1)}-${(games-expWkW).toFixed(1)}`}</td>
      <td>${own==null?"\u2014":pct3(own)}</td>
      <td class="exp">${wp==null?"\u2014":pct3(wp)}</td>
      <td>${luckG==null?"\u2014":`<span style="background:${heat(1-(0.5+luckG/8))};padding:1px 6px;border-radius:2px">${luckG>=0?"+":""}${luckG.toFixed(1)}</span>`}</td>
      <td>${r.gb===0?"\u2014":r.gb.toFixed(1)}</td>
      <td>${longestStreak(r.manager)}</td>
      <td>${longestSkid(r.manager)}</td>
      <td>${weeksInFirst(r.manager)}</td>
      <td class="l form">${seasonForm(r.manager)}</td></tr>`;}).join("");
  el("v-standings").innerHTML=`<p class="lede">Expected columns are what the numbers say you deserved. Expected categories comes from all-play, your share of every category against every manager each week. Expected weeks compares your weekly category total against what everyone else scored that same week, so it is the share of weeks you would win against a random opponent. Luck is how many wins in the standings you gained or lost against that. Click any name for that manager's page.</p>
    <div class="ramp"><span class="key"><i style="background:var(--win)"></i>won</span>
      <span class="key"><i style="background:var(--loss)"></i>lost</span>
      <span class="key"><i style="background:rgba(255,255,255,.28)"></i>tied</span></div>
    <div class="scroll"><table><thead><tr><th class="l">#</th><th class="l">Manager</th>
      <th>Categories</th><th class="exp">Expected</th>
      <th>Pct</th><th class="exp">Expected</th>
      <th>Weeks</th><th class="exp">Expected</th>
      <th>Pct</th><th class="exp">Expected</th>
      <th title="Wins gained or lost against what you deserved">Luck (games)</th>
      <th>GB</th><th>Best run</th><th>Worst skid</th><th>Wks 1st</th>
      <th class="l">Last 5</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function vMatchups(){
  const S=D.seasons[season];
  const all=[...new Set(S.matchups.map(m=>m.week))].sort((a,b)=>a-b);
  const isPO=w=>S.matchups.some(m=>m.week===w&&m.stage!=="Regular");
  if(week===null||!all.includes(week)) week=all.filter(w=>!isPO(w)).pop()??all[all.length-1];
  const detail=(D.weeklyDetail[season]||{});
  const picker=`<div class="wk-pick" role="group" aria-label="Choose week">${
    all.map(w=>`<button type="button" data-w="${w}" class="${isPO(w)?"po":""}" aria-pressed="${w===week}">${w}</button>`).join("")}</div>`;

  const nonScoring=new Set(D.nonScoring||[]);
  const CATS=D.cats.filter(c=>!nonScoring.has(c));
  const CIDX=CATS.map(c=>D.cats.indexOf(c));
  const live=new Set(((D.bracket&&D.bracket[season])||{}).live||[]);
  const realPO=m=>m.stage==="Regular"||live.has(`${m.week}|${m.a}|${m.b}`);
  const games=S.matchups.filter(m=>m.week===week&&realPO(m)).map((m,gi)=>{
    const tag=m.stage!=="Regular"?`<span class="stagetag">${esc(m.stage)}</span>`:"";
    const da=detail[m.a]&&detail[m.a][week], db=detail[m.b]&&detail[m.b][week];
    let grid="";
    if(da&&db&&da.opponent===m.b){
      const head=CATS.map(c=>`<th class="eq">${esc(c)}${lower.has(c)?" ↓":""}</th>`).join("");
      const line=(who,mine,other)=>`<tr><td class="l">${nameBtn(who)}</td>${
        CIDX.map((i,n)=>{
          const c=CATS[n], v=mine.you[i], o=other.you[i];
          let cls="eq";
          if(v!=null&&o!=null&&!isNaN(+v)&&!isNaN(+o)&&+v!==+o)
            cls+= (lower.has(c)? (+v<+o) : (+v>+o)) ? " catw" : " catl";
          return `<td class="${cls}">${fmtStat(c,v)}</td>`;}).join("")}</tr>`;
      grid=`<div class="catbox" id="cat-${gi}" hidden><div class="scroll"><table class="catline"><thead><tr>
        <th class="l">Team</th>${head}</tr></thead><tbody>
        ${line(m.a,da,db)}${line(m.b,db,da)}</tbody></table></div></div>`;
    }
    return `<div class="game${grid?" clickable":""}"${grid?` data-g="${gi}" tabindex="0" role="button" aria-expanded="false"`:""}>
      <div class="side"><div class="nm">${nameBtn(m.a)}${tag}</div><div class="tm">${esc(S.teamNames[m.a]||"")}</div></div>
      <div class="tally"><span class="v ${m.aw>m.al?"win":""}">${m.aw}</span><i>–</i><span class="v ${m.al>m.aw?"win":""}">${m.al}</span></div>
      <div class="side b"><div class="nm">${nameBtn(m.b)}</div><div class="tm">${esc(S.teamNames[m.b]||"")}</div></div>
      ${grid?`<div style="grid-column:1/-1">${grid}</div>`:""}</div>`;
  }).join("");

  el("v-matchups").innerHTML=`<p class="lede">Every matchup, week by week. The score is categories won. Tap a matchup for the category breakdown. Playoff weeks are marked in gold.</p>
    ${picker}<div style="height:12px"></div>
    <div class="games">${games||'<p class="empty">No games recorded.</p>'}</div>`;
  el("v-matchups").querySelector(".wk-pick").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    week=+b.dataset.w;render();};
  el("v-matchups").querySelectorAll(".game.clickable").forEach(g=>{
    const box=g.querySelector(".catbox");
    const flip=ev=>{ if(ev.target.closest(".who")) return;
      const open=!box.hidden; box.hidden=open; g.setAttribute("aria-expanded",String(!open)); };
    g.onclick=flip;
    g.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); flip(ev); } };
  });
}

function svgLine(o){
  const {series,labels,yMin,yMax,invert,yTitle}=o;
  const W=760,H=300,ml=46,mr=14,mt=12,mb=34,iw=W-ml-mr,ih=H-mt-mb,n=labels.length;
  const xAt=i=>ml+(n<=1?iw/2:iw*i/(n-1));
  const yAt=v=>{const t=(v-yMin)/((yMax-yMin)||1);return mt+(invert?t*ih:(1-t)*ih);};
  let g="";
  for(let k=0;k<=5;k++){const v=yMin+(yMax-yMin)*k/5,y=yAt(v);
    g+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.10)"/>`;
    g+=`<text x="${ml-8}" y="${(y+4).toFixed(1)}" fill="#828C84" font-size="11" text-anchor="end">${Math.round(v)}</text>`;}
  const step=n>16?Math.ceil(n/12):1;
  labels.forEach((lb,i)=>{if(i%step===0||i===n-1)
    g+=`<text x="${xAt(i).toFixed(1)}" y="${H-12}" fill="#828C84" font-size="11" text-anchor="middle">${lb}</text>`;});
  g+=`<text x="13" y="${(mt+ih/2).toFixed(1)}" fill="#828C84" font-size="11" text-anchor="middle" transform="rotate(-90 13 ${(mt+ih/2).toFixed(1)})">${yTitle}</text>`;
  let p="";
  series.forEach(s=>{if(s.hidden)return;
    p+=`<path d="${s.data.map((v,i)=>(i?"L":"M")+xAt(i).toFixed(1)+" "+yAt(v).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linejoin="round"/>`;
    const li=s.data.length-1;
    p+=`<circle cx="${xAt(li).toFixed(1)}" cy="${yAt(s.data[li]).toFixed(1)}" r="${s.width>2?3.5:2.5}" fill="${s.color}"/>`;});
  const shown=series.filter(s=>!s.hidden);
  let hit="";
  labels.forEach((lb,i)=>{
    const rows=shown.map(s=>({name:s.name||"",color:s.color,v:s.data[i]}))
      .sort((a,b)=>b.v-a.v);
    const payload=rows.map(r=>`${r.name}\u0001${r.color}\u0001${r.v}`).join("\u0002");
    hit+=`<rect class="hit" x="${(xAt(i)-(iw/Math.max(1,n-1))/2).toFixed(1)}" y="${mt}"
      width="${(iw/Math.max(1,n-1)).toFixed(1)}" height="${ih}" fill="transparent"
      data-lb="${esc(String(lb))}" data-rows="${esc(payload)}"/>`;
    hit+=`<line class="guide" x1="${xAt(i).toFixed(1)}" y1="${mt}" x2="${xAt(i).toFixed(1)}" y2="${mt+ih}"
      stroke="rgba(255,255,255,.35)" stroke-width="1" style="display:none"/>`;
  });
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" style="width:100%;height:auto;display:block">${g}${p}${hit}</svg><div class="tip" hidden></div></div>`;
}
function movesChart(labels){
  const per=(D.moves&&D.moves[season])||null;
  if(!per) return "";
  const series=D.managers.map(m=>{let run=0;
    return {name:m,color:col(m),hidden:hidden.has(m),width:m==="Benny"?3:1.6,
      data:labels.map(w=>{const c=(per[m]||{})[String(w)];run+=c?c.add+c.drop:0;return run;})};});
  const peak=Math.max(10,...series.flatMap(s=>s.data));
  const totals=D.managers.map(m=>({m,n:labels.reduce((t,w)=>{
    const c=(per[m]||{})[String(w)];return t+(c?c.add+c.drop:0);},0)})).sort((a,b)=>b.n-a.n);
  return `<div class="chartbox"><h3>Roster moves, running total</h3>
    <p>Adds and drops combined, adding up as the season goes. Free agent and waiver moves only, so trades are not counted. Adds are capped at four a week by league rules.</p>
    ${svgLine({series,labels,yMin:0,yMax:Math.ceil(peak/10)*10,yTitle:"Moves"})}
    <p class="note">Season totals: ${totals.map(t=>`${esc(t.m)} ${t.n}`).join(" · ")}</p></div>`;
}

function wireHover(host){
  el(host).querySelectorAll(".chartwrap").forEach(wrap=>{
    const tip=wrap.querySelector(".tip"), svg=wrap.querySelector("svg");
    const guides=[...wrap.querySelectorAll(".guide")];
    const hits=[...wrap.querySelectorAll(".hit")];
    const hide=()=>{tip.hidden=true;guides.forEach(g=>g.style.display="none");};
    hits.forEach((h,i)=>{
      const show=ev=>{
        guides.forEach((g,j)=>g.style.display=j===i?"":"none");
        const rows=(h.getAttribute("data-rows")||"").split("\u0002").filter(Boolean)
          .map(r=>r.split("\u0001"));
        tip.innerHTML=`<div class="tiphd">Week ${h.getAttribute("data-lb")}</div>`+
          rows.map(([nm,c,v])=>`<div class="tiprow"><span class="dot" style="background:${c}"></span>
            <span class="tn">${nm}</span><span class="tv">${v}</span></div>`).join("");
        tip.hidden=false;
        const box=wrap.getBoundingClientRect();
        const px=(ev.touches?ev.touches[0].clientX:ev.clientX)-box.left;
        tip.style.left=Math.min(Math.max(px+14,8),box.width-190)+"px";
      };
      h.addEventListener("mousemove",show);
      h.addEventListener("touchstart",show,{passive:true});
    });
    wrap.addEventListener("mouseleave",hide);
  });
}

/* ---------- team stats (sortable) ---------- */
function vStats(){
  const S=D.seasons[season],ranks={},share={};
  const nonScoring=new Set(D.nonScoring||[]);
  const CATS=D.cats.filter(c=>!nonScoring.has(c));
  const CIDX=CATS.map(c=>D.cats.indexOf(c));
  const who=Object.keys(S.seasonStats);
  D.cats.forEach((c,j)=>{
    const pairs=who.map(m=>[m,parseFloat(S.seasonStats[m][j])]).filter(p=>!isNaN(p[1]));
    if(!pairs.length) return;
    const sorted=[...pairs].sort((a,b)=>lower.has(c)?a[1]-b[1]:b[1]-a[1]);
    sorted.forEach(([m],i)=>ranks[m+"|"+c]=i+1);
    const vals=pairs.map(p=>p[1]), lo=Math.min(...vals), hi=Math.max(...vals);
    pairs.forEach(([m,v])=>{
      // 1 == leads the league, 0 == trails, spaced by the actual gap
      let t = hi===lo ? 0.5 : (v-lo)/(hi-lo);
      share[m+"|"+c] = lower.has(c) ? 1-t : t;
    });
  });
  const pctl=(m,c)=>{const t=share[m+"|"+c]; return t==null?"":Math.round(t*100);};
  let order=S.standings.map(r=>r.manager).filter(m=>S.seasonStats[m]);
  if(sortCol!==null){
    const j=sortCol;
    order=[...order].sort((a,b)=>{
      const va=S.seasonStats[a][j],vb=S.seasonStats[b][j];
      return (va-vb)*sortDir;
    });
  }
  const ths=D.cats.map((c,j)=>{
    const st=sortCol===j?(sortDir===1?"ascending":"descending"):"none";
    return `<th class="sortable eq" data-c="${j}" aria-sort="${st}" title="${esc(c)}${lower.has(c)?" — lower is better":""}">${esc(c)}${lower.has(c)?" ↓":""}</th>`;
  }).join("");
  const rows=order.map(m=>`<tr><td class="l">${nameBtn(m)}</td>${
    D.cats.map((c,j)=>{const r=ranks[m+"|"+c],t=share[m+"|"+c];
      const bg = (t==null||nonScoring.has(c)) ? "transparent" : heat(1-t);
      return `<td class="eq" style="background:${bg}" title="${esc(c)}${r?` — rank ${r} of ${order.length}`:""}">${
        statMode==="raw"?fmtStat(c,S.seasonStats[m][j]):(nonScoring.has(c)?"":pctl(m,c))}</td>`;}).join("")}</tr>`).join("");
  const hm=(S.weeks.length?S.standings.map(r=>r.manager).filter(m=>S.heatmap[m]):[]).map(m=>`<tr><td class="l">${nameBtn(m)}</td>${
    S.heatmap[m].map(v=>v==null?`<td class="c">·</td>`:
      `<td class="c" style="background:${heat(1-Math.max(0,Math.min(1,(v-2)/17)))}">${v}</td>`).join("")}</tr>`).join("");
  el("v-stats").innerHTML=`<p class="lede">Season totals. Click a column to sort. Arrows mark categories where a lower number is better, and shading reflects how far ahead or behind the number actually is, not just the finishing order.</p>
    <div class="toggle" id="statToggle" role="group" aria-label="Display mode">
      <button type="button" data-m="raw" aria-pressed="${statMode==="raw"}">Totals</button>
      <button type="button" data-m="pctl" aria-pressed="${statMode==="pctl"}">Percentile</button></div>
    <div class="ramp"><span>Trails league</span><span class="strip"></span><span>Leads league</span></div>
    <div class="scroll"><table><thead><tr><th class="l">Manager</th>${ths}</tr></thead><tbody>${rows}</tbody></table></div>
    ${hm?`<h2 class="sec">Categories won each week</h2><p class="lede">Out of 22.</p>
    <div class="scroll"><table class="hm"><thead><tr><th class="l">Manager</th>${S.weeks.map(w=>`<th>${w}</th>`).join("")}</tr></thead><tbody>${hm}</tbody></table></div>`:""}`;
  el("statToggle").onclick=e=>{const b=e.target.closest("button");if(!b)return;statMode=b.dataset.m;render();};
  el("v-stats").querySelectorAll("th.sortable").forEach(th=>{
    th.onclick=()=>{const j=+th.dataset.c;
      if(sortCol===j) sortDir=-sortDir; else {sortCol=j;sortDir=lower.has(D.cats[j])?1:-1;}
      render();};
  });
}

/* ---------- head to head + popover ---------- */
function closePop(){const p=document.querySelector(".pop");if(p)p.remove();}
function openPop(mode,a,b,x,y){
  closePop();
  const wantPO = mode==="po";
  const rows=YEARS.map(s=>{
    const gs=D.seasons[s].matchups.filter(m=>(wantPO?m.stage!=="Regular":m.stage==="Regular")&&
      ((m.a===a&&m.b===b)||(m.a===b&&m.b===a)));
    let w=0,l=0,t=0,cw=0,cl=0,ct=0;
    gs.forEach(m=>{const me=m.a===a?{w:m.aw,l:m.al}:{w:m.al,l:m.aw};
      cw+=me.w;cl+=me.l;ct+=m.at;
      if(me.w>me.l)w++;else if(me.w<me.l)l++;else t++;});
    if(!gs.length) return `<tr><td>${s}</td><td colspan="2" style="color:var(--bone-faint)">—</td></tr>`;
    return `<tr><td>${s}</td><td>${rec(w,l,t)}</td><td style="color:var(--bone-dim)">${cw}-${cl}-${ct}</td></tr>`;
  }).join("");
  const d=document.createElement("div");
  d.className="pop";
  d.innerHTML=`<button class="cls" aria-label="Close">×</button>
    <h4><span class="dot" style="background:${col(a)}"></span>${esc(a)}
      <span style="color:var(--bone-faint);font-size:12px">vs</span>

  d.style.left=Math.min(x+12,window.innerWidth-r.width-12)+"px";

  d.querySelector(".cls").onclick=closePop;
}

/* ---------- bracket ---------- */
function vBracket(){
  const post=D.postseason.filter(g=>g.season==+season&&g.stage==="Playoff");
  if(!post.length){
    el("v-bracket").innerHTML=`<p class="lede">Championship bracket.</p>
      <p class="empty">No playoff results recorded for ${esc(season)} yet.</p>`;return;
  }
  const seeds=D.seeds[season]||{};
  const pick=n=>post.filter(g=>g.game===n);
  const qf=pick("Quarterfinal"),sf=pick("Semifinal"),fin=pick("Final")[0],third=pick("3rd Place")[0];
  const inQF=new Set(qf.flatMap(g=>[g.winner,g.loser]));
  const byes=Object.keys(seeds).filter(m=>seeds[m]<=6&&!inQF.has(m)).sort((a,b)=>seeds[a]-seeds[b]);
  const sdOf=m=>seeds[m]||"";
  const tie=g=>{
    if(!g) return `<div class="byebox">—</div>`;
    const isTie=g.ws===g.ls;
    return `<div class="tie">
      <div class="row w"><span class="sd">${sdOf(g.winner)}</span><span class="dot" style="background:${col(g.winner)}"></span>
        <span class="nm">${nameBare(g.winner)}</span><span class="sc">${g.ws}</span></div>
      <div class="row lo"><span class="sd">${sdOf(g.loser)}</span><span class="dot" style="background:${col(g.loser)}"></span>
        <span class="nm">${nameBare(g.loser)}</span><span class="sc">${g.ls}</span></div>
      ${isTie?`<div class="tiebreak">Tied ${g.ws}–${g.ls}, decided on seed</div>`:""}</div>`;
  };
  const bye=m=>`<div class="byebox"><span class="sd" style="font-family:var(--cond);width:14px">${sdOf(m)}</span>
    <span class="dot" style="background:${col(m)}"></span>${nameBare(m)} <span style="margin-left:auto">bye</span></div>`;
  // true two-sided bracket: each half = bye + its quarterfinal, converging on the final
  const halves = sf.map(semi=>{
    const byeTeam = [semi.winner,semi.loser].find(m=>byes.includes(m)) || null;
    const other   = [semi.winner,semi.loser].find(m=>m!==byeTeam);
    const feeder  = qf.find(g=>g.winner===other) || null;
    return {byeTeam, feeder, semi};
  });
  while(halves.length<2) halves.push({byeTeam:null,feeder:null,semi:null});
  halves.sort((a,b)=>(seeds[a.byeTeam]||99)-(seeds[b.byeTeam]||99));
  const [H1,H2]=halves;
  const sideCol=(H,flip)=>`<div class="brcol">
      <div class="rndlbl">FIRST ROUND</div>
      ${H.byeTeam?bye(H.byeTeam):""}
      ${H.feeder?tie(H.feeder):""}</div>
    <div class="brcol"><div class="rndlbl">SEMIFINAL</div>${tie(H.semi)}</div>`;
  el("v-bracket").innerHTML=`<p class="lede">Championship bracket. The top two seeds sat out the first round; the small number beside each name is their seed.</p>
    <div class="bracket bracket5">
      ${sideCol(H1)}
      <div class="brcol">
        <div class="rndlbl">FINAL</div>${tie(fin)}
        ${fin?`<div class="champbox"><div class="lb">CHAMPION</div>
          <div class="nm"><span class="dot" style="background:${col(fin.winner)};width:12px;height:12px"></span>${esc(fin.winner)} \u{1F451}</div></div>`:""}
        ${third?`<div class="rndlbl" style="margin-top:14px">THIRD PLACE</div>${tie(third)}`:""}
      </div>
      <div class="brcol"><div class="rndlbl">SEMIFINAL</div>${tie(H2.semi)}</div>
      <div class="brcol">
        <div class="rndlbl">FIRST ROUND</div>
        ${H2.byeTeam?bye(H2.byeTeam):""}
        ${H2.feeder?tie(H2.feeder):""}</div>
    </div>`;
}

    <h2 class="sec">Head to head, regular season</h2><div id="h2h-reg"></div>

function tradeBlock(m){
  const all=(D.trades||[]).filter(t=>t.parties.includes(m));
  if(!all.length) return `<h2 class="sec">Trades</h2><p class="empty">No trades on record.</p>`;
  const byYear={};
  all.forEach(t=>{(byYear[t.season]=byYear[t.season]||[]).push(t);});
  const blocks=Object.keys(byYear).sort((a,b)=>b-a).map(y=>{
    const rows=byYear[y].slice().sort((a,b)=>b.ts-a.ts).map(t=>{
      const other=t.parties.filter(p=>p!==m);
      const got=(t.got[m]||[]).map(p=>esc(p.player)).join(", ")||"\u2014";
      const gave=other.flatMap(o=>(t.got[o]||[]).map(p=>esc(p.player))).join(", ")||"\u2014";
      const d=new Date(t.ts*1000);
      const when=isNaN(d)?"\u2014":d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
      return `<tr><td>${when}</td><td class="l">${other.map(nameBtn).join(", ")}</td>
        <td class="l">${got}</td><td class="l">${gave}</td></tr>`;}).join("");
    return `<h3 class="yrhead">${y}<span class="sub">${byYear[y].length} trade${byYear[y].length>1?"s":""}</span></h3>
      <div class="scroll"><table><thead><tr><th>Date</th><th class="l">With</th>
        <th class="l">Received</th><th class="l">Sent</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  return `<h2 class="sec">Trades</h2>
    <p class="lede">${all.length} trade${all.length>1?"s":""} on record, newest season first.</p>${blocks}`;
}

function vManager(){
  if(!who){el("v-manager").innerHTML=`<p class="empty">Pick a manager.</p>`;return;}
  const life=D.lifetime.find(x=>x.manager===who);
  const reg=[];
  SEASONS.forEach(s=>D.seasons[s].matchups.forEach(m=>{
    if(m.stage!=="Regular")return;
    if(m.a===who)reg.push({s:+s,wk:m.week,opp:m.b,w:m.aw,l:m.al});
    else if(m.b===who)reg.push({s:+s,wk:m.week,opp:m.a,w:m.al,l:m.aw});}));
  reg.sort((a,b)=>a.s-b.s||a.wk-b.wk);
  const best=reg.reduce((a,b)=>(b.w-b.l)>(a.w-a.l)?b:a);
  const worst=reg.reduce((a,b)=>(b.w-b.l)<(a.w-a.l)?b:a);
  let cur=0,bestStreak=0;reg.forEach(g=>{if(g.w>g.l){cur++;bestStreak=Math.max(bestStreak,cur);}else cur=0;});
  const titles=SEASONS.filter(s=>(D.finalPlace[s]||[])[0]===who).length;
  const reg1=SEASONS.filter(s=>D.seasons[s].standings[0].manager===who).length;
  const pay=D.payouts[who];
  const names=[];SEASONS.forEach(s=>{const n=D.seasons[s].teamNames[who];
    if(!names.length||names[names.length-1].n!==n)names.push({from:s,to:s,n});else names[names.length-1].to=s;});
  const finishes=SEASONS.map(s=>{
    const st=D.seasons[s].standings,i=st.findIndex(r=>r.manager===who),r=st[i];
    const fin=(D.finalPlace[s]||[]).indexOf(who);
    return `<tr><td class="l">${s}</td><td class="l sub">${esc(D.seasons[s].teamNames[who])}</td>
      <td style="background:${heat(i/9)}">${i+1}</td><td>${rec(r.w,r.l,r.t)}</td><td>${pct3(r.pct)}</td>
      <td>${rec(r.mw,r.ml,r.mt)}</td><td>${fin>=0?fin+1:"—"}</td>
      <td>${pay.bySeason[s]?"$"+pay.bySeason[s]:"—"}</td></tr>`;}).join("");
  const opps=D.managers.filter(m=>m!==who).map(m=>{
    const r=D.h2h[who][m],tot=r.w+r.l+r.t,s=tot?(r.w+r.t/2)/tot:.5;return {m,r,s};})
    .sort((a,b)=>b.s-a.s);
  const oppRows=opps.map(o=>{
    const c=(D.h2hCats&&D.h2hCats[who]&&D.h2hCats[who][o.m])||null;
    const cn=c?c.w+c.l+c.t:0, cp=cn?(c.w+c.t/2)/cn:null;
    return `<tr><td class="l">${nameBtn(o.m)}</td>
    <td class="cell ${o.r.w>o.r.l?"w":o.r.l>o.r.w?"l":"e"}" style="background:${o.r.w>o.r.l?"rgba(196,47,69,.42)":o.r.l>o.r.w?"rgba(49,89,158,.42)":"rgba(255,255,255,.10)"}">${rec(o.r.w,o.r.l,o.r.t)}</td>
    <td>${pct3(o.s)}</td>
    <td>${c?rec(c.w,c.l,c.t):"\u2014"}</td>
    <td>${cp==null?"\u2014":pct3(cp)}</td></tr>`;}).join("");
  el("v-manager").innerHTML=`
    <button type="button" class="back" id="mgBack">← Back</button>
    <div class="mghead"><span class="dot" style="background:${col(who)};width:20px;height:20px"></span>
      <span class="mgname">${esc(who)}</span><span>${crowns(who)}</span></div>
    <p class="lede">${esc(D.seasons[String(D.meta.currentSeason)].teamNames[who])} — four seasons in The Frank Cup.</p>
    <div class="kpis">
      <div class="kpi"><div class="k">WEEKS W-L-T</div><div class="v">${rec(...life.match)}</div></div>
      <div class="kpi"><div class="k">WIN PCT</div><div class="v">${pct3(life.matchPct)}</div></div>
      <div class="kpi"><div class="k">CATEGORIES</div><div class="v">${rec(...life.cat)}</div></div>
      <div class="kpi"><div class="k">TITLES</div><div class="v">${titles}</div></div>
      <div class="kpi"><div class="k">REG. SEASON #1</div><div class="v">${reg1}</div></div>
      <div class="kpi"><div class="k">EARNINGS</div><div class="v">${pay.total?"$"+pay.total.toLocaleString():"$0"}</div></div>
      <div class="kpi"><div class="k">LONGEST RUN</div><div class="v">${bestStreak}<span style="font-size:13px;color:var(--bone-faint)"> wks</span></div></div>
      <div class="kpi"><div class="k">BEST WEEK</div><div class="v">${best.w}–${best.l}</div><div class="sub">${best.s} wk ${best.wk} v ${esc(best.opp)}</div></div>
      <div class="kpi"><div class="k">WORST WEEK</div><div class="v">${worst.w}–${worst.l}</div><div class="sub">${worst.s} wk ${worst.wk} v ${esc(worst.opp)}</div></div>
    </div>
    <h2 class="sec">Season by season</h2>
    <div class="scroll"><table><thead><tr><th class="l">Season</th><th class="l">Team</th><th>Reg. finish</th>
      <th>Categories</th><th>Pct</th><th>Weeks</th><th>Final</th><th>Won</th></tr></thead><tbody>${finishes}</tbody></table></div>
    <h2 class="sec">Team name history</h2>
    <div>${names.map(n=>`<div class="namerow"><span class="yr">${n.from===n.to?n.from:n.from+"–"+n.to}</span><span>${esc(n.n)}</span></div>`).join("")}</div>
    <h2 class="sec">Against everyone else</h2>
    <p class="lede">Regular season only, all four seasons. Weeks is the matchup record, categories is every individual category across those weeks.</p>
    <div class="scroll"><table><thead><tr><th class="l">Opponent</th><th>Weeks</th><th>Pct</th>
      <th>Categories</th><th>Pct</th></tr></thead><tbody>${oppRows}</tbody></table></div>
    ${playerBlocks(who)}
    ${tradeBlock(who)}`;
  el("mgBack").onclick=()=>{view=backTo;render();};
}

function render(){
  document.body.setAttribute("data-season",season);
  closePop();
  document.body.setAttribute("data-season",season);
  el("parkName").textContent=PARK_NAMES[season]||"";
  el("seasonPick").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===season));
  el("nav").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view?"page":"false"));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  el("v-"+view).classList.add("on");
  ({standings:vStandings,matchups:vMatchups,trends:vTrends,stats:vStats,
    bracket:vBracket,history:vHistory,manager:vManager})[view]();
}
buildChrome();render();
})();
</script>
</body>
</html>

name: Research pull (manual)

# One-off: saves Yahoo player rankings with stats as a downloadable zip.
# Only runs when started by hand. Commits nothing to the site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull Yahoo rankings
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python -u scripts/yahoo_ranks.py

      - name: Save as a download
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-ranks
          path: research_out
          retention-days: 7

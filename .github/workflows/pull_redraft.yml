name: Pull redraft era (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull 2011-2022 into raw_redraft
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python -u scripts/pull_redraft.py
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add raw_redraft
          git diff --cached --quiet || (git commit -m "Redraft era archive" && git pull --rebase && git push)

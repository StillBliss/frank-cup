name: Weekly Yahoo refresh

on:
  # 4:00 AM Pacific, Mondays, during baseball season only.
  # GitHub runs on UTC. Pacific is UTC-7 (PDT) most of the season,
  # so 4 AM Pacific = 11:00 UTC. Months limited to Mar-Oct.
  schedule:
    - cron: "0 11 * 3-10 1"
  workflow_dispatch:
    inputs:
      redo_news:
        description: "Rewrite the newest Gazette issue"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull from Yahoo and rebuild data.js
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/update.py

      - name: Write the Gazette
        # the news can never break the data refresh
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_REDO: ${{ inputs.redo_news && 'latest' || '' }}
        run: python scripts/news.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.js raw league_config.json
          if [ -f news.js ]; then git add news.js; fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly data refresh"
            git push
          fi

      - name: Ask GitHub Pages to republish
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
